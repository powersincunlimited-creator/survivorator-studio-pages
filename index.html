<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivorator Studio</title>
<style>
:root {
  --bg: #0f1220; --panel: #171b2e; --panel2: #1e2340; --line: #2b3257; --text: #e6e9f5; --dim: #8e97bd; --accent: #5ec8ff; --accent2: #ff5cc8;
  --ok: #5fe39a; --warn: #ffcb5c; --bad: #ff6b7a; --input: #0c0f1c; --radius: 8px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 188px 1fr; grid-template-rows: 48px 1fr; height: 100%; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; letter-spacing: .04em; color: var(--accent); }
header .logo b { color: var(--accent2); }
header .spacer { flex: 1; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; overflow: auto; }
nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--dim); cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
nav button:hover { background: var(--panel2); color: var(--text); }
nav button.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 var(--accent); }
nav .badge { font-size: 11px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; align-self: center; }
nav h4 { margin: 12px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); font-weight: 600; }
main { overflow: auto; padding: 18px 22px 60px; }
h2 { margin: 0 0 4px; font-size: 20px; }
h3 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; }
p.lead { color: var(--dim); margin: 0 0 14px; max-width: 80ch; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); cursor: pointer; }
input[type=text], input[type=number], select, textarea { background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
input[type=number] { width: 110px; }
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input.bad, select.bad, textarea.bad { border-color: var(--bad); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; min-height: 260px; }
input[type=color] { width: 40px; height: 28px; padding: 0; background: none; border: 1px solid var(--line); border-radius: 5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.card > summary { cursor: pointer; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.row { display: grid; grid-template-columns: 190px 1fr; gap: 10px; align-items: start; padding: 5px 0; border-bottom: 1px solid #ffffff08; }
.row > label { color: var(--text); padding-top: 5px; }
.row .hint { color: var(--dim); font-size: 12px; margin-top: 3px; max-width: 90ch; }
.row .ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .unit { color: var(--dim); font-size: 12px; }
.row.changed > label::after { content: " ●"; color: var(--accent2); }
.split { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); max-height: calc(100vh - 150px); overflow: auto; }
.list .item { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #ffffff08; gap: 6px; }
.list .item:hover { background: var(--panel2); }
.list .item.on { background: var(--panel2); box-shadow: inset 3px 0 var(--accent2); }
.list .item small { color: var(--dim); }
.list .tools { padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.problems { list-style: none; padding: 0; margin: 0; }
.problems li { padding: 5px 8px; border-left: 3px solid var(--bad); background: var(--panel); margin-bottom: 4px; border-radius: 0 5px 5px 0; cursor: pointer; }
.problems li:hover { background: var(--panel2); }
.problems li b { color: var(--bad); }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.mod { display: flex; gap: 8px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.mod.off { opacity: .6; } .mod small { color: var(--dim); display: block; }
table.t { border-collapse: collapse; width: 100%; } table.t th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; padding: 2px 6px; } table.t td { padding: 2px 4px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; z-index: 10; max-width: 420px; }
.tag { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; margin: 1px 3px 1px 0; font-size: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; } .kv b { color: var(--dim); font-weight: 500; }
.dim { color: var(--dim); }
@media (max-width: 760px) { #app { grid-template-columns: 1fr; grid-template-rows: 48px auto 1fr; } header { grid-column: 1; } nav { flex-direction: row; overflow-x: auto; padding: 6px; } nav h4 { display: none; }
  .split { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }

.modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 20; }
.dlg { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 18px 20px; width: min(460px, 92vw); }
.dlg p { margin: 0 0 10px; }

</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">SURVIVORATOR <b>STUDIO</b></span>
    <select id="packSelect" title="Which game pack you are editing"></select>
    <button class="btn small" id="newPack" title="Copy this pack under a new name">New pack…</button>
    <span class="spacer"></span>
    <button class="chip" id="whoBtn" title="Your name, shown next to your saves">…</button>
    <span class="chip" id="problemChip" title="Problems the validator found in this pack">…</span>
    <span class="chip" id="saveChip">…</span>
    <button class="btn primary" id="saveBtn" title="Ctrl+S">Save</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"><p class="lead">Connecting to the studio database…</p></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, getDocs, setDoc, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const DATA = {"firebase": {"apiKey": "AIzaSyBt9shBGY0WwQABtPpLVAz-YVrO4pKmwFU", "authDomain": "survivorator-studio.firebaseapp.com", "projectId": "survivorator-studio", "storageBucket": "survivorator-studio.firebasestorage.app", "messagingSenderId": "303198919420", "appId": "1:303198919420:web:c93eef0f6dd1199c475579"}, "schema": {"format": 0, "note": "Every rules knob the engine knows: its default (today's game), its limits and what it means. game.json 'rules' and the presets may set any of these by area.knob; anything not set falls back to 'default'. The validator and (later) the studio form read this file; scripts/rules.gd reads it at run time. See design/RULES_KNOBS.md.", "areas": {"waves": {"label": "Waves and pacing", "knobs": {"length_base": {"default": 40.0, "min": 5.0, "max": 600.0, "unit": "s", "label": "Wave length, wave 1", "desc": "Seconds wave 1 lasts. Wave N lasts length_base + length_per_wave x N seconds, up to length_cap."}, "length_per_wave": {"default": 3.0, "min": 0.0, "max": 60.0, "unit": "s", "label": "Wave length growth", "desc": "Seconds added to the wave length for each wave number."}, "length_cap": {"default": 90.0, "min": 5.0, "max": 1200.0, "unit": "s", "label": "Longest wave", "desc": "Waves never last longer than this."}, "spawn_interval_start": {"default": 1.8, "min": 0.1, "max": 20.0, "unit": "s", "label": "Spawn gap, wave 1", "desc": "Seconds between spawns on wave 1 for one hero (co-op divides it by the party size)."}, "spawn_rate_growth": {"default": 0.1, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Spawn speed-up", "desc": "How much faster spawning gets each wave: the gap is spawn_interval_start / (1 + growth x (wave - 1))."}, "spawn_interval_min": {"default": 0.45, "min": 0.05, "max": 10.0, "unit": "s", "label": "Fastest spawn gap", "desc": "The spawn gap never gets shorter than this."}, "batch_max": {"default": 4, "min": 1, "max": 20, "unit": "enemies", "label": "Most enemies per spawn", "desc": "A spawn can bring several enemies at once; the batch grows by one every batch_every waves up to this."}, "batch_every": {"default": 4, "min": 1, "max": 50, "unit": "waves", "label": "Batch growth", "desc": "Waves between each +1 to the spawn batch size."}, "crowd_cap_per_hero": {"default": 60, "min": 10, "max": 500, "unit": "enemies", "label": "Crowd cap", "desc": "Most enemies alive at once for one hero. Also a performance limit: crowds cost more than their head count."}, "crowd_cap_party_bonus": {"default": 30, "min": 0, "max": 500, "unit": "enemies", "label": "Crowd cap per extra hero", "desc": "Each hero beyond the first adds this to the crowd cap."}}}, "enemies": {"label": "Enemy growth", "knobs": {"hp_growth": {"default": 0.1, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Health growth", "desc": "Enemy health grows this fraction of its starting health every wave (wave N: 1 + growth x (N - 1))."}, "hp_growth_late": {"default": 0.05, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Extra health growth (late)", "desc": "More health growth on top, every wave after late_from_wave (so health grows faster once the early waves are over)."}, "damage_growth": {"default": 0.12, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Damage growth", "desc": "Enemy damage (touch hits and bullets) grows this fraction every wave after late_from_wave. Bosses keep their own numbers."}, "late_from_wave": {"default": 2, "min": 0, "max": 100, "unit": "wave", "label": "Late growth starts after", "desc": "The extra health growth and the damage growth count waves above this one (2 = they start on wave 3)."}, "speed_growth": {"default": 0.06, "min": 0.0, "max": 1.0, "unit": "x per wave", "label": "Speed growth", "desc": "Enemy speed grows this fraction every wave, up to speed_cap."}, "speed_cap": {"default": 2.2, "min": 1.0, "max": 10.0, "unit": "x", "label": "Speed cap", "desc": "Enemies never get faster than this multiple of their starting speed (before the early-wave bonus). Set below the hero's speed and they can never catch a moving hero."}, "early_fade_wave": {"default": 6, "min": 2, "max": 100, "unit": "wave", "label": "Gentle-start fade", "desc": "The early-wave bonuses below are full on wave 1 and fade to nothing on this wave."}, "early_hp": {"default": 0.33, "min": 0.0, "max": 3.0, "unit": "x", "label": "Early health bonus", "desc": "Extra enemy health on wave 1 (fades out). Early waves are made tougher so a hero standing still cannot ignore them; 0 = none."}, "early_speed": {"default": 0.15, "min": 0.0, "max": 3.0, "unit": "x", "label": "Early speed bonus", "desc": "Extra enemy speed on wave 1 (fades out); 0 = none."}, "early_spawn_rate": {"default": 0.64, "min": 0.0, "max": 5.0, "unit": "x", "label": "Early spawn bonus", "desc": "Extra spawn rate on wave 1 (fades out); 0 = none."}, "elite_chance_scale": {"default": 1.0, "min": 0.0, "max": 10.0, "unit": "x", "label": "Elite chance scale", "desc": "Multiplies every kind's elite chance (0 = no elites at all, 2 = twice as many). Only kinds that define an `elite` ever spawn elite."}}}, "bosses": {"label": "Bosses", "knobs": {"hp_per_extra_hero": {"default": 0.8, "min": 0.0, "max": 5.0, "unit": "x per hero", "label": "Boss health per extra hero", "desc": "In co-op a boss has this much more health for every hero beyond the first (0.8 = +80%)."}, "hp_per_loop": {"default": 0.25, "min": 0.0, "max": 5.0, "unit": "x per loop", "label": "Boss health per repeat", "desc": "Each time the boss list has been used up and starts again, the bosses have this much more health."}, "backup_slowdown": {"default": 5.0, "min": 1.0, "max": 50.0, "unit": "x", "label": "Boss backup trickle", "desc": "A boss that calls henchmen gets them one at a time at the normal spawn gap times this (5 = a fifth of the normal rate)."}, "backup_secs": {"default": 14.0, "min": 1.0, "max": 120.0, "unit": "s", "label": "Backup duration", "desc": "How long one 'calls backup at X% health' trigger keeps the henchmen coming."}, "collect_min_secs": {"default": 0.8, "min": 0.0, "max": 10.0, "unit": "s", "label": "Loot vacuum, shortest", "desc": "After a boss falls everything on the field flies to the heroes; the wave ends once it is all in, but not sooner than this."}, "collect_max_secs": {"default": 3.0, "min": 0.5, "max": 30.0, "unit": "s", "label": "Loot vacuum, longest", "desc": "...and never later than this, whatever is left."}}}, "hero": {"label": "Hero", "knobs": {"xp_first_level": {"default": 60.0, "min": 1.0, "max": 100000.0, "unit": "xp", "label": "XP for level 2", "desc": "Experience a hero needs to reach level 2 (every enemy kill gives xp)."}, "xp_per_level": {"default": 40.0, "min": 0.0, "max": 100000.0, "unit": "xp", "label": "XP growth per level", "desc": "Each level needs this much more than the last (level N needs xp_first_level + xp_per_level x (N - 1))."}, "grace_after_hit": {"default": 0.5, "min": 0.0, "max": 5.0, "unit": "s", "label": "Grace after a hit", "desc": "Seconds a hero cannot be hurt again after taking a hit."}, "revive_health": {"default": 0.5, "min": 0.05, "max": 1.0, "unit": "fraction", "label": "Revive health", "desc": "Health a downed hero comes back with (1 = full)."}, "revive_grace": {"default": 1.5, "min": 0.0, "max": 10.0, "unit": "s", "label": "Grace after revive", "desc": "Seconds a revived hero cannot be hurt."}, "power_slots": {"default": 6, "min": 1, "max": 6, "unit": "powers", "label": "Power slots", "desc": "Powers a hero can have active at once (the held-weapon layout supports up to 6)."}, "gear_bag_size": {"default": 16, "min": 0, "max": 60, "unit": "pieces", "label": "Gear bag", "desc": "Spare gear pieces a hero can carry."}, "power_bench_size": {"default": 14, "min": 0, "max": 60, "unit": "powers", "label": "Power bench", "desc": "Spare powers a hero can bank (for combining and fusing)."}, "base_stats": {"type": "stats", "default": {}, "label": "Starting stats", "desc": "Overrides for every hero's starting stat block, by stat name (the engine's own defaults are Player.BASE: max_hp 100, move_speed 210, crit_chance 0.10, crit_damage 1.75, pickup_radius 96, ...). A hero class's own bonuses and gear stack on top. Only the stats named here change."}, "ability_default": {"type": "text", "default": "roll", "label": "Default ability", "desc": "The id of the ability (abilities.json) every hero gets unless its own entry in heroes.json names one. Empty = no ability."}, "ability_cooldown_scale": {"default": 1.0, "min": 0.1, "max": 10.0, "unit": "x", "label": "Ability cooldown scale", "desc": "Multiplies every ability's cooldown (2 = twice as long)."}}}, "shop": {"label": "Shop and prices", "knobs": {"offer_count": {"default": 5, "min": 1, "max": 12, "unit": "offers", "label": "Offers per shop", "desc": "Power and item offers each hero sees in the between-wave shop."}, "reroll_cost": {"default": 4, "min": 0, "max": 1000, "unit": "currency", "label": "Reroll price", "desc": "What the first reroll of the offers costs."}, "reroll_step": {"default": 2, "min": 0, "max": 1000, "unit": "currency", "label": "Reroll price growth", "desc": "Each further reroll in the same shop costs this much more."}, "gear_offer_count": {"default": 4, "min": 1, "max": 12, "unit": "pieces", "label": "Gear offers", "desc": "Gear pieces on offer in the gear tab."}, "gear_reroll_cost": {"default": 6, "min": 0, "max": 1000, "unit": "currency", "label": "Gear reroll price", "desc": "What the first reroll of the gear offers costs."}, "gear_reroll_step": {"default": 3, "min": 0, "max": 1000, "unit": "currency", "label": "Gear reroll growth", "desc": "Each further gear reroll costs this much more."}, "power_price_basic": {"default": 15, "min": 1, "max": 1000, "unit": "currency", "label": "Basic power price", "desc": "Base price (before rarity) of a power with a basic delivery: projectile, melee swing, cone, thrust, sweep and the other simple shapes."}, "power_price_area": {"default": 17, "min": 1, "max": 1000, "unit": "currency", "label": "Area power price", " /* The pack validator in the browser: a port of tools/pack/validate_pack.py (keep the two in step; tools/studio/parity_check.py compares them on real and broken packs).
   validatePack(pack) -> array of "file.json: message" strings. `C` (DATA.consts) holds the engine's lists of names, read from the game's scripts at build time. */

const isNum = x => typeof x === "number" && !Number.isNaN(x);
const isObj = x => x !== null && typeof x === "object" && !Array.isArray(x);
const num = (x, d) => (x === undefined || x === null ? d : x);

function checkRules(where, block, knobs, err, C, abilityIds) {
  if (!isObj(block)) { err("game.json", `${where} must be an object of areas`); return; }
  for (const [area, vals] of Object.entries(block)) {
    if (!isObj(vals)) { err("game.json", `${where}.${area} must be an object of knobs`); continue; }
    for (const [k, v] of Object.entries(vals)) {
      const path = `${area}.${k}`;
      const spec = knobs[path];
      if (!spec) err("game.json", `${where}: unknown rule '${path}'`);
      else if (spec.type === "text") {
        if (typeof v !== "string") err("game.json", `${where}: rule '${path}' must be text (got ${JSON.stringify(v)})`);
        else if (path === "hero.ability_default" && abilityIds && v !== "" && !abilityIds.includes(v)) err("game.json", `${where}: rule '${path}' = '${v}' is not an ability in abilities.json`);
      } else if (spec.type === "choice") {
        if (!spec.options.includes(v)) err("game.json", `${where}: rule '${path}' must be one of ${spec.options.join(", ")} (got ${JSON.stringify(v)})`);
      } else if (spec.type === "list") {
        const ok = Array.isArray(v) && (spec.length === null || v.length === spec.length) && v.every(x => isNum(x) && spec.min <= x && x <= spec.max);
        if (!ok) err("game.json", `${where}: rule '${path}' must be a list of ${spec.length !== null ? spec.length : "any number of"} numbers between ${spec.min} and ${spec.max}`);
      } else if (spec.type === "budget") {
        if (!isObj(v)) err("game.json", `${where}: rule '${path}' must be an object of lanes`);
        else for (const [lane, rows] of Object.entries(v)) {
          if (!(lane in spec.default)) { err("game.json", `${where}: rule '${path}': unknown lane '${lane}'`); continue; }
          let good = Array.isArray(rows) && rows.length > 0 && rows.every(r => Array.isArray(r) && r.length === 2 && r.every(isNum) && r[0] >= 1 && spec.min <= r[1] && r[1] <= spec.max);
          if (good) for (let i = 0; i < rows.length - 1; i++) if (rows[i][0] >= rows[i + 1][0]) good = false;
          if (!good) err("game.json", `${where}: rule '${path}.${lane}' must be rows of [wave, number] with the waves increasing`);
        }
      } else if (spec.type === "stats") {
        if (!isObj(v)) err("game.json", `${where}: rule '${path}' must be an object of stat: number`);
        else for (const [sk, sv] of Object.entries(v)) {
          if (!C.stats.includes(sk)) err("game.json", `${where}: rule '${path}': unknown stat '${sk}'`);
          else if (!isNum(sv)) err("game.json", `${where}: rule '${path}.${sk}' must be a number (got ${JSON.stringify(sv)})`);
        }
      } else if (!isNum(v)) err("game.json", `${where}: rule '${path}' must be a number (got ${JSON.stringify(v)})`);
      else if (!(spec.min <= v && v <= spec.max)) err("game.json", `${where}: rule '${path}' = ${v} is outside ${spec.min} .. ${spec.max}`);
      else if (Number.isInteger(spec.default) && !Number.isInteger(v)) err("game.json", `${where}: rule '${path}' must be a whole number (got ${v})`);
    }
  }
}

function validatePack(pack) {
  const C = DATA.consts;
  const errs = [];
  const err = (where, msg) => errs.push(`${where}: ${msg}`);
  const knobs = {};
  for (const [a, area] of Object.entries(DATA.schema.areas)) for (const [k, v] of Object.entries(area.knobs)) knobs[`${a}.${k}`] = v;
  const library = DATA.presets.presets;

  for (const n of C.files) if (!isObj(pack[n])) err(n + ".json", "missing or not a JSON object");
  if (errs.length) return errs;

  const g = pack.game;
  if (g.format !== 0) err("game.json", `format must be 0 (got ${JSON.stringify(g.format)})`);
  const mods = g.modules || {};
  for (const [m, v] of Object.entries(mods)) {
    if (!C.modules.names.includes(m)) err("game.json", `unknown module '${m}' (the modules are: ${C.modules.names.join(", ")})`);
    else if (typeof v !== "boolean") err("game.json", `module '${m}' must be true or false`);
  }
  for (const [m, needs] of Object.entries(C.modules.requires)) {
    if (num(mods[m], true) === true) for (const need of needs) if (num(mods[need], true) === false) err("game.json", `module '${m}' needs module '${need}', which is off`);
  }

  const abilityIds = [];
  for (const a of pack.abilities.abilities || []) {
    const aid = a.id ?? "?";
    abilityIds.push(aid);
    if (!C.ability_kinds.includes(a.kind)) { err("abilities.json", `${aid}: unknown kind ${JSON.stringify(a.kind)} (the kinds are: ${C.ability_kinds.join(", ")})`); continue; }
    for (const k of ["name", "cooldown"]) if (!(k in a)) err("abilities.json", `${aid}: missing '${k}'`);
    if (!isNum(num(a.cooldown, 1)) || num(a.cooldown, 1) <= 0) err("abilities.json", `${aid}: cooldown must be above 0`);
    if (!Number.isInteger(num(a.charges, 1)) || num(a.charges, 1) < 1) err("abilities.json", `${aid}: charges must be a whole number, 1 or more`);
    for (const k of C.ability_required[a.kind]) if (!isNum(a[k]) || a[k] <= 0) err("abilities.json", `${aid}: a ${a.kind} needs '${k}' above 0`);
    if (a.kind === "burst_heal" && !(num(a.heal, 0) > 0 || num(a.heal_pct, 0) > 0)) err("abilities.json", `${aid}: a burst_heal needs 'heal' or 'heal_pct'`);
  }
  if (new Set(abilityIds).size !== abilityIds.length) err("abilities.json", "an ability id appears twice");
  checkRules("rules", g.rules ?? {}, knobs, err, C, abilityIds);
  let presets = g.presets ?? {};
  if (!isObj(presets)) { err("game.json", "presets must be an object of named presets"); presets = {}; }
  for (const [name, block] of Object.entries(presets)) checkRules(`preset '${name}'`, block, knobs, err, C, abilityIds);
  const spec = g.preset ?? "";
  if (typeof spec !== "string") err("game.json", "preset must be a name (or names joined by +)");
  else for (const n of spec.split("+").filter(Boolean)) if (!(n in presets) && !(n in library)) err("game.json", `preset '${n}' is not one of the pack's presets or the shared library (${Object.keys(library).join(", ")})`);

  const ar = pack.arena;
  const sz = ar.size;
  if (!(Array.isArray(sz) && sz.length === 2 && sz.every(x => isNum(x) && x >= 500))) err("arena.json", "size must be [width, height], each at least 500");
  if (!Array.isArray(ar.props)) err("arena.json", "props must be a list");
  if (!isObj(num(ar.camera_margin, {}))) err("arena.json", "camera_margin must be an object");
  else if (Array.isArray(sz) && sz.length === 2) for (const prop of ar.props || []) if (!Array.isArray(prop.parts)) err("arena.json", `prop '${prop.id}' has no parts list`);

  const puppets = new Set(pack.puppets.puppets || []);
  const powerIds = [];
  for (const p of pack.powers.powers || []) {
    const pid = p.id ?? "?";
    powerIds.push(pid);
    if (!C.shapes.includes(p.shape)) err("powers.json", `${pid}: unknown shape ${JSON.stringify(p.shape)}`);
    if (!C.damage_types.includes(p.damage_type)) err("powers.json", `${pid}: unknown damage_type ${JSON.stringify(p.damage_type)}`);
    for (const k of ["name", "tags"]) if (!(k in p)) err("powers.json", `${pid}: missing '${k}'`);
    const st = (p.effect || {}).status;
    if (st !== undefined && st !== null && !C.statuses.includes(st)) err("powers.json", `${pid}: unknown status ${JSON.stringify(st)}`);
  }
  if (new Set(powerIds).size !== powerIds.length) err("powers.json", "a power id appears twice");
  const powers = new Set(powerIds);

  const heroIds = [];
  for (const h of pack.heroes.heroes || []) {
    const hid = h.id ?? "?";
    heroIds.push(hid);
    if (!powers.has(h.start_power)) err("heroes.json", `${hid}: start_power ${JSON.stringify(h.start_power)} is not a power`);
    for (const k of Object.keys(h.stats || {})) if (!C.stats.includes(k)) err("heroes.json", `${hid}: unknown stat '${k}'`);
    if (num(h.ability, "") !== "" && !abilityIds.includes(h.ability)) err("heroes.json", `${hid}: ability ${JSON.stringify(h.ability)} is not in abilities.json`);
    if (!puppets.has("hero_" + hid)) err("puppets.json", `hero ${hid} has no puppet 'hero_${hid}' listed`);
  }
  const heroes = new Set(heroIds);
  if (heroes.size !== heroIds.length) err("heroes.json", "a hero id appears twice");

  for (const table of ["weapon", "projectile_visual", "projectile_impact"]) for (const pid of Object.keys(pack.looks[table] || {})) if (!powers.has(pid)) err("looks.json", `${table}: '${pid}' is not a power`);

  const en = pack.enemies;
  const order = en.order || [], kinds = en.kinds || {};
  const orderSet = new Set(order), kindSet = new Set(Object.keys(kinds));
  if (orderSet.size !== kindSet.size || [...orderSet].some(x => !kindSet.has(x))) err("enemies.json", "'order' and 'kinds' must list the same ids");
  for (const [kid, k] of Object.entries(kinds)) {
    for (const s of ["hp", "speed", "damage", "radius", "color", "freeze_cap", "xp"]) if (!(s in (k.stats || {}))) err("enemies.json", `${kid}: stats.${s} missing`);
    if (!C.silhouettes.includes(k.shape)) err("enemies.json", `${kid}: unknown shape ${JSON.stringify(k.shape)}`);
    const pu = num(k.puppet, "");
    if (pu && !puppets.has(pu)) err("enemies.json", `${kid}: puppet '${pu}' is not listed in puppets.json`);
  }
  for (const [kid, k] of Object.entries(kinds)) {
    const det = num(k.detect, 0);
    if (!isNum(det) || det < 0) err("enemies.json", `${kid}: detect must be a number, 0 or more`);
    const mv = k.move || {};
    const style = num(mv.style, "direct");
    if (!C.enemy.move_styles.includes(style)) err("enemies.json", `${kid}: unknown move style '${style}' (the styles are: ${C.enemy.move_styles.join(", ")})`);
    if ((style === "wander" || style === "lurk") && !(det > 0)) err("enemies.json", `${kid}: the ${style} style needs a detect radius above 0 (otherwise it is always aware and never idles)`);
    if (style === "wander") {
      if (num(mv.turn_min, 20) > num(mv.turn_max, 80) || num(mv.time_min, 0.8) > num(mv.time_max, 2.0)) err("enemies.json", `${kid}: wander needs turn_min <= turn_max and time_min <= time_max`);
      const ws = num(mv.wander_speed, 0.4);
      if (!(0 < ws && ws <= 1)) err("enemies.json", `${kid}: wander_speed must be above 0 and at most 1 (a share of its speed)`);
    }
    const at = k.attack;
    if (at && Object.keys(at).length) {
      if (!C.enemy.attack_types.includes(at.type)) err("enemies.json", `${kid}: unknown attack type ${JSON.stringify(at.type)} (the types are: ${C.enemy.attack_types.join(", ")}; a shooting kind uses 'ranged')`);
      else if (at.type === "dash") for (const f of ["range", "windup", "speed", "distance", "cooldown", "damage"]) if (!isNum(at[f]) || at[f] <= 0) err("enemies.json", `${kid}: a dash attack needs '${f}' above 0`);
      if (k.ranged && Object.keys(k.ranged).length) err("enemies.json", `${kid}: a kind has either 'ranged' or 'attack', not both`);
    }
    const rg = k.ranged || {};
    if (Object.keys(rg).length) {
      const rs = num(rg.style, "light");
      if (!C.enemy.ranged_styles.includes(rs)) err("enemies.json", `${kid}: unknown ranged style ${JSON.stringify(rg.style)} (the styles are: ${C.enemy.ranged_styles.join(", ")})`);
      if (["burst", "spray", "ring"].includes(rg.style) && !(Number.isInteger(rg.shots) && rg.shots >= 2)) err("enemies.json", `${kid}: a ${rg.style} needs 'shots' (a whole number, 2 or more)`);
      if (rg.style === "bomb" && !(num(rg.blast_radius, 0) > 0 && num(rg.fuse, 0) > 0)) err("enemies.json", `${kid}: a bomb needs 'blast_radius' and 'fuse' above 0`);
    }
    const od = k.on_death || {};
    if (Object.keys(od).length) {
      if (!C.enemy.death_types.includes(od.type)) err("enemies.json", `${kid}: unknown on_death type ${JSON.stringify(od.type)} (the types are: ${C.enemy.death_types.join(", ")})`);
      else if (od.type === "split" && !(od.into in kinds)) err("enemies.json", `${kid}: on_death split into unknown kind ${JSON.stringify(od.into)}`);
      else if (od.type === "split" && od.into === kid) err("enemies.json", `${kid}: a kind cannot split into itself (it would never stop)`);
      else if (od.type === "explode" && !(num(od.radius, 0) > 0 && num(od.damage, 0) > 0)) err("enemies.json", `${kid}: an explosion needs 'radius' and 'damage' above 0`);
      else if (od.type === "drop" && !(Number.isInteger(od.stars) && od.stars >= 1)) err("enemies.json", `${kid}: a drop needs 'stars' (a whole number, 1 or more)`);
    }
    const el = k.elite || {};
    if (Object.keys(el).length) {
      if (!(0 < num(el.chance, 0) && num(el.chance, 0) <= 1)) err("enemies.json", `${kid}: elite chance must be above 0 and at most 1`);
      for (const f of ["hp_mult", "damage_mult", "speed_mult", "size", "xp_mult", "drop_mult"]) if (f in el && !(isNum(el[f]) && el[f] > 0)) err("enemies.json", `${kid}: elite ${f} must be above 0`);
    }
    const tr = k.traits || {};
    for (const [tk, tv] of Object.entries(tr)) {
      if (!C.enemy.trait_keys.includes(tk)) err("enemies.json", `${kid}: unknown trait '${tk}' (the traits are: ${C.enemy.trait_keys.join(", ")})`);
      else if (!isNum(tv) || tv < 0) err("enemies.json", `${kid}: trait '${tk}' must be a number, 0 or more`);
    }
    if (!(0 <= num(tr.knockback_resist, 0) && num(tr.knockback_resist, 0) <= 1)) err("enemies.json", `${kid}: knockback_resist must be between 0 and 1`);
    if (!(0 <= num(tr.enrage_at, 0) && num(tr.enrage_at, 0) <= 1)) err("enemies.json", `${kid}: enrage_at must be between 0 and 1 (a fraction of its health)`);
  }
  if (order.length && order[order.length - 1] !== "wanted") err("enemies.json", "the last kind must be the villain placeholder 'wanted'");
  const sp = en.spawn || {};
  const wts = sp.weights || [];
  for (const rule of wts) {
    if (!(rule.kind in kinds) || rule.kind === "wanted") err("enemies.json", `spawn.weights: unknown kind ${JSON.stringify(rule.kind)}`);
    if (!(isNum(rule.weight) && rule.weight > 0)) err("enemies.json", `spawn.weights: ${rule.kind}: weight must be above 0`);
    if (num(rule.from, 1) > num(rule.to, 9999)) err("enemies.json", `spawn.weights: ${rule.kind}: from must not be above to`);
  }
  if (wts.length && (sp.roll || []).length) err("enemies.json", "spawn has both 'weights' and 'roll': use one (keep roll empty when using weights)");
  for (const rule of sp.roll || []) if (!(rule.kind in kinds)) err("enemies.json", `spawn.roll: unknown kind ${JSON.stringify(rule.kind)}`);
  if (!(sp.default in kinds)) err("enemies.json", "spawn.default is not a kind");
  for (const key of ["early_shooter", "pack"]) { const blk = sp[key] || {}; if (Object.keys(blk).length && !(blk.kind in kinds)) err("enemies.json", `spawn.${key}: unknown kind ${JSON.stringify(blk.kind)}`); }

  const bossIds = [];
  for (const b of pack.bosses.bosses || []) {
    const bid = b.id ?? "?";
    bossIds.push(bid);
    if (!powers.has(b.signature)) err("bosses.json", `${bid}: signature ${JSON.stringify(b.signature)} is not a power`);
    if (!C.silhouettes.includes(b.shape)) err("bosses.json", `${bid}: unknown shape ${JSON.stringify(b.shape)}`);
    for (const a of b.abilities || []) {
      if (!C.boss_abilities.includes(a.name)) err("bosses.json", `${bid}: unknown ability ${JSON.stringify(a.name)}`);
      if (a.name === "summon" && !(a.add in kinds)) err("bosses.json", `${bid}: summon adds unknown kind ${JSON.stringify(a.add)}`);
    }
  }

  const ge = pack.gear;
  const setIds = new Set(Object.keys(ge.sets || {}));
  for (const [sid, s] of Object.entries(ge.sets || {})) {
    for (const slot of ge.slots || []) {
      const piece = (s.pieces || {})[slot];
      if (!piece) { err("gear.json", `${sid}: no piece for slot '${slot}'`); continue; }
      for (const k of Object.keys(piece.mods || {})) if (!C.stats.includes(k)) err("gear.json", `${sid}/${slot}: unknown stat '${k}'`);
    }
    for (const bonus of ["b2", "b3", "b4"]) for (const k of Object.keys(s[bonus] || {})) if (!C.stats.includes(k)) err("gear.json", `${sid}.${bonus}: unknown stat '${k}'`);
  }
  for (const t of pack.talents.talents || []) if (!C.stats.includes(t.stat)) err("talents.json", `${t.name}: unknown stat ${JSON.stringify(t.stat)}`);

  const ac = pack.achievements;
  const recipeKeys = new Set(Object.keys(pack.fusion.recipes || {}));
  const cats = { archetypes: heroes, powers, gear_sets: setIds, fusion_recipes: recipeKeys };
  for (const [cat, ids] of Object.entries(ac.starters || {})) {
    if (!(cat in cats)) { err("achievements.json", `starters: unknown category '${cat}'`); continue; }
    for (const i of ids) if (!cats[cat].has(i)) err("achievements.json", `starters.${cat}: '${i}' does not exist`);
  }
  for (const a of ac.achievements || []) {
    for (const r of a.rewards || []) {
      if (!C.reward_categories.includes(r.category)) err("achievements.json", `${a.id}: unknown reward category ${JSON.stringify(r.category)}`);
      else if (!cats[r.category].has(r.id)) err("achievements.json", `${a.id}: reward ${r.category}/${r.id} does not exist`);
    }
    const c = a.cond || {};
    if (c.type === "villain" && !bossIds.includes(c.villain)) err("achievements.json", `${a.id}: villain ${JSON.stringify(c.villain)} is not a boss`);
    if (c.type === "wave" && c.archetype && !heroes.has(c.archetype)) err("achievements.json", `${a.id}: archetype '${c.archetype}' is not a hero`);
  }
  for (const key of Object.keys(pack.fusion.recipes || {})) {
    const parts = key.split("+");
    const sorted = [...parts].sort();
    if (parts.length !== 2 || parts.join("+") !== sorted.join("+")) err("fusion.json", `recipe key '${key}' must be two power ids joined by '+', in alphabetical order`);
    else for (const p of parts) if (!powers.has(p)) err("fusion.json", `recipe ${key}: '${p}' is not a power`);
  }
  for (const pid of Object.keys(pack.fusion.fragments || {})) if (!powers.has(pid)) err("fusion.json", `fragments: '${pid}' is not a power`);
  for (const hid of Object.keys(pack.hero_effects.profiles || {})) if (!heroes.has(hid)) err("hero_effects.json", `profile for '${hid}' which is not a hero`);
  for (const [hid, sid] of Object.entries(pack.shop.own_set || {})) {
    if (!heroes.has(hid)) err("shop.json", `own_set: '${hid}' is not a hero`);
    if (!setIds.has(sid)) err("shop.json", `own_set: '${sid}' is not a gear set`);
  }
  return errs;
}

/* Survivorator Studio: the editor for game packs (packs/<game>/*.json). Everything is saved to Firestore (packs/<pack>/files/<name> = {json, updated, by}); tools/studio/sync_pack.py moves it to and from the repo files the game reads. */

// ---------------------------------------------------------------- small helpers
// append() that also takes arrays of nodes (what the form builders return) and skips null / false, so conditional pieces can just be passed in
const _nativeAppend = Element.prototype.append;
Element.prototype.append = function (...kids) { return _nativeAppend.apply(this, kids.flat(Infinity).filter(k => k !== null && k !== undefined && k !== false)); };
const C = DATA.consts;
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v === null || v === undefined) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else if (k === "checked") e.checked = !!v;
    else if (k === "html") e.innerHTML = v;
    else e.setAttribute(k, v === true ? "" : v);

  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return e;
}
const clone = x => JSON.parse(JSON.stringify(x));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isObjV = x => x !== null && typeof x === "object" && !Array.isArray(x);
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function toast(msg, ms = 3500) { const t = h("div", { class: "toast" }, msg); document.body.append(t); setTimeout(() => t.remove(), ms); }

// in-page dialogs (the browser's own prompt() and confirm() are blocked in some browsers and embedded views)
function ask(msg, def = "") {
  return new Promise(res => {
    const input = h("input", { type: "text", style: "width:100%", value: def });
    const done = v => { ov.remove(); res(v); };
    const ov = h("div", { class: "modal" }, h("div", { class: "dlg" }, h("p", {}, msg), input, h("div", { class: "ctl", style: "margin-top:12px" }, h("button", { class: "btn primary", onclick: async () => done(input.value) }, "OK"), h("button", { class: "btn", onclick: async () => done(null) }, "Cancel"))));
    input.addEventListener("keydown", e => { if (e.key === "Enter") done(input.value); if (e.key === "Escape") done(null); });
    document.body.append(ov); input.focus(); input.select();
  });
}
function sure(msg) {
  return new Promise(res => {
    const done = v => { ov.remove(); res(v); };
    const ov = h("div", { class: "modal" }, h("div", { class: "dlg" }, h("p", {}, msg), h("div", { class: "ctl", style: "margin-top:12px" }, h("button", { class: "btn primary", onclick: async () => done(true) }, "Yes"), h("button", { class: "btn", onclick: async () => done(false) }, "No"))));
    document.body.append(ov);
  });
}
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, ""); }

// ---------------------------------------------------------------- state
const S = {
  pack: null, packs: [], files: {}, orig: {}, meta: {}, dirty: new Set(), tab: "overview", problems: [], user: "", sel: {}, unsub: null,
  fire: { db: null, ready: false },
};
S.user = localStorage.getItem("studio_who") || "";

const TABS = [
  ["overview", "Overview", ""], ["rules", "Rules", "game"], ["presets", "Presets", "game"],
  ["enemies", "Enemies", "enemies"], ["abilities", "Abilities", "abilities"], ["content", "All content", ""], ["problems", "Problems", ""],
];

// ---------------------------------------------------------------- firebase
const app = initializeApp(DATA.firebase);
const auth = getAuth(app);
const db = getFirestore(app);
S.fire.db = db;

async function signIn() {
  await signInAnonymously(auth);
  await new Promise(res => { const u = onAuthStateChanged(auth, user => { if (user) { u(); res(); } }); });
  S.fire.ready = true;
}

async function listPacks() {
  const snap = await getDocs(collection(db, "packs"));
  S.packs = snap.docs.map(d => d.id).sort();
}

async function loadPack(name) {
  if (S.unsub) { S.unsub(); S.unsub = null; }
  S.pack = name;
  S.files = {}; S.orig = {}; S.meta = {}; S.dirty.clear(); S.sel = {};
  const snap = await getDocs(collection(db, "packs", name, "files"));
  for (const d of snap.docs) ingest(d);
  localStorage.setItem("studio_pack", name);
  revalidate(); renderAll();
  S.unsub = onSnapshot(collection(db, "packs", name, "files"), snap2 => {
    let changed = false;
    for (const ch of snap2.docChanges()) {
      const d = ch.doc;
      if (d.metadata.hasPendingWrites) continue;
      const by = d.data().by;
      if (S.dirty.has(d.id) || S.orig[d.id] === d.data().json) continue;
      ingest(d); changed = true;
      if (by && by !== S.user) toast(`${by} saved ${d.id}.json`);
    }
    if (changed) { revalidate(); renderAll(); }
  });
}

function ingest(d) {
  const data = d.data();
  try { S.files[d.id] = JSON.parse(data.json); S.orig[d.id] = data.json; S.meta[d.id] = { by: data.by || "", updated: data.updated && data.updated.toDate ? data.updated.toDate() : null }; }
  catch (e) { toast(`${d.id}.json in the cloud is not valid JSON`); }
}

async function saveAll() {
  if (!S.dirty.size) return;
  const names = [...S.dirty];
  for (const n of names) {
    const text = serialize(S.files[n]);
    const payload = { json: text, updated: serverTimestamp(), by: S.user || "someone" };
    await setDoc(doc(db, "packs", S.pack, "files", n), payload);
    try { await addDoc(collection(db, "packs", S.pack, "files", n, "history"), payload); } catch (e) { /* history is a nicety */ }
    S.orig[n] = text;
    S.dirty.delete(n);
  }
  await setDoc(doc(db, "packs", S.pack), { name: S.pack, updated: serverTimestamp() });
  updateChrome();
  toast(`Saved ${names.length} file${names.length > 1 ? "s" : ""} (${names.join(", ")}). To use it in the game: py tools/studio/sync_pack.py pull ${S.pack}`, 6000);
}

async function newPack() {
  const name = slug(await ask("Name for the new pack (letters, numbers, underscores). It starts as a copy of " + S.pack + ":") || "");
  if (!name) return;
  if (S.packs.includes(name)) { toast("A pack with that name already exists"); return; }
  for (const [n, f] of Object.entries(S.files)) await setDoc(doc(db, "packs", name, "files", n), { json: serialize(f), updated: serverTimestamp(), by: S.user || "someone" });
  await setDoc(doc(db, "packs", name), { name, updated: serverTimestamp() });
  await listPacks(); renderPackSelect(); await loadPack(name); renderPackSelect();
}

// A document in Firestore can hold at most 1 MiB: big files (the arena art) are stored compact, the rest indented so they read well.
function serialize(file) {
  const pretty = JSON.stringify(file, null, "	");
  return pretty.length > 600000 ? JSON.stringify(file) : pretty;
}

// ---------------------------------------------------------------- dirty + validation
function ids(file, list) { return ((S.files[file] || {})[list] || []).map(x => x.id).filter(Boolean); }
const revalidate = debounce(() => { runValidation(); updateChrome(); if (S.tab === "problems") renderMain(); }, 150);
function runValidation() {
  try { S.problems = validatePack(S.files); } catch (e) { S.problems = ["validator: " + e.message]; }
}
function touch(file) { S.dirty.add(file); revalidate(); updateChrome(); }
function problemsFor(file, needle) { return S.problems.filter(p => p.startsWith(file + ".json:") && (!needle || p.includes(needle))); }
function problemBlock(list) { return list.length ? h("ul", { class: "problems" }, list.map(p => h("li", {}, h("b", {}, "⚠ "), p.replace(/^[a-z_]+\.json: /, "")))) : h("span", {}); }

// ---------------------------------------------------------------- field builders (each edits obj[key] in place and calls touch(file))
function row(label, ctl, hint, changed) {
  return h("div", { class: "row" + (changed ? " changed" : "") }, h("label", {}, label), h("div", {}, h("div", { class: "ctl" }, ctl), hint ? h("div", { class: "hint" }, hint) : null));
}

  if (obj[key] !== undefined) input.value = obj[key];
  input.addEventListener("change", () => {
    if (input.value === "") { if (o.optional || o.def !== undefined) delete obj[key]; }

  input.value = obj[key] ?? "";

}

  const wrap = h("div", {}, h("h2", {}, "Problems"), h("p", { class: "lead" }, "What the same validator the game's tools use finds in this pack. Click one to open the file it is in. Fix them all before pulling the pack into the game."));
  if (!S.problems.length) { wrap.append(h("p", { class: "chip ok" }, "✓ no problems found")); return wrap; }
  wrap.append(h("ul", { class: "problems" }, S.problems.map(p => h("li", { onclick: async () => { const file = p.split(".json")[0]; if (FILE_TAB[file]) S.tab = FILE_TAB[file]; else { S.tab = "content"; S.sel.file = file; S.sel.item = null; } renderNav(); renderMain(); } }, h("b", {}, p.split(": ")[0] + " "), p.split(": ").slice(1).join(": ")))));
  return wrap;
}

// ---------------------------------------------------------------- boot
async function boot() {
  $("#saveBtn").addEventListener("click", () => saveAll().catch(e => toast("Save failed: " + e.message)));
  $("#newPack").addEventListener("click", () => newPack().catch(e => toast("Could not create the pack: " + e.message)));
  $("#packSelect").addEventListener("change", async e => { if (S.dirty.size && !await sure("You have unsaved changes in this pack. Switch anyway and lose them?")) { renderPackSelect(); return; } loadPack(e.target.value); });
  $("#whoBtn").addEventListener("click", async () => { const n = await ask("Your name (shown next to your saves):", S.user); if (n !== null) { S.user = n.trim(); localStorage.setItem("studio_who", S.user); updateChrome(); } });
  $("#problemChip").addEventListener("click", () => { S.tab = "problems"; renderNav(); renderMain(); });
  window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveAll().catch(err => toast("Save failed: " + err.message)); } });
  window.addEventListener("beforeunload", e => { if (S.dirty.size) { e.preventDefault(); e.returnValue = ""; } });
  window.__studio = { S, validatePack, DATA };   // for the parity check and debugging
  try {
    await signIn();
    await listPacks();
    if (!S.user) { const n = await ask("Welcome! Your name (shown next to your saves):", ""); S.user = (n || "").trim(); localStorage.setItem("studio_who", S.user); }
    if (!S.packs.length) { $("#main").innerHTML = "<p class='lead'>The cloud has no packs yet. Seed one from the repo with: py tools/studio/sync_pack.py push placeholder</p>"; return; }
    const want = localStorage.getItem("studio_pack");
    await loadPack(S.packs.includes(want) ? want : S.packs[0]);
  } catch (e) {
    $("#main").innerHTML = "";
    $("#main").append(h("p", { class: "lead" }, "Could not reach the studio database: " + e.message + ". Check your connection (and that Anonymous sign-in and Firestore are enabled in the Firebase console)."));
  }
}
boot();

</script>
</body>
</html>
