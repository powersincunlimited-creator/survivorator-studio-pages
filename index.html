<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Survivorator Studio</title>
<style>
:root {
  --bg: #0f1220; --panel: #171b2e; --panel2: #1e2340; --line: #2b3257; --text: #e6e9f5; --dim: #8e97bd; --accent: #5ec8ff; --accent2: #ff5cc8;
  --ok: #5fe39a; --warn: #ffcb5c; --bad: #ff6b7a; --input: #0c0f1c; --radius: 8px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 var(--font); }
button, input, select, textarea { font: inherit; color: inherit; }
#app { display: grid; grid-template-columns: 188px 1fr; grid-template-rows: 48px 1fr; height: 100%; }
header { grid-column: 1 / 3; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
header .logo { font-weight: 700; letter-spacing: .04em; color: var(--accent); }
header .logo b { color: var(--accent2); }
header .spacer { flex: 1; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 10px 8px; display: flex; flex-direction: column; gap: 3px; overflow: auto; }
nav button { text-align: left; margin-left: 6px; background: none; border: 0; padding: 8px 10px; border-radius: 6px; color: var(--dim); cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
nav button:hover { background: var(--panel2); color: var(--text); }
nav button.on { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 var(--accent); }
nav .badge { font-size: 11px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; align-self: center; }
nav h4 { margin: 16px 0 4px; padding: 7px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; background: var(--panel2); border-bottom: 2px solid var(--accent); border-radius: 5px 5px 0 0; }   /* a section heading: a shaded band with an underline, so it reads as different from the pages under it */
nav h4:first-child { margin-top: 2px; }
main { overflow: auto; padding: 18px 22px 60px; }
h2 { margin: 0 0 4px; font-size: 20px; }
h3 { margin: 18px 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; }
p.lead { color: var(--dim); margin: 0 0 14px; max-width: 80ch; }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #04121c; border-color: var(--accent); font-weight: 600; }
.btn.primary:disabled { opacity: .45; cursor: default; }
.btn.danger:hover { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.chip { font-size: 12px; padding: 3px 9px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
.chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); cursor: pointer; }
input[type=text], input[type=number], select, textarea { background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
input[type=number] { width: 110px; }
.row .ctl > input[type=text]:only-child, input.wide { width: min(100%, 440px); max-width: 440px; flex: 1 1 220px; }   /* grows to 440px, shrinks so a button beside it stays on the line */   /* a lone text field (name, blurb, description) is wide enough to read */
input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
input.bad, select.bad, textarea.bad { border-color: var(--bad); }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; min-height: 260px; }
input[type=color] { width: 40px; height: 28px; padding: 0; background: none; border: 1px solid var(--line); border-radius: 5px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.card > summary { cursor: pointer; font-weight: 600; }
.card[open] > summary { padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
/* a form section laid out in two columns: short rows side by side with the label above, wide rows (.w2) and anything that is not a row across both */
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, max(330px, 48%)), 1fr)); gap: 0 26px; margin-top: 6px; }
.cgrid > .row { grid-template-columns: minmax(0, 1fr); gap: 3px; align-content: start; }   /* (a row stretched to its neighbour's height keeps its label and field together at the top) */
.cgrid > .row > label { padding-top: 0; font-size: 12px; color: var(--dim); }
.cgrid > .row.w2, .cgrid > :not(.row) { grid-column: 1 / -1; }
.cardbar { display: flex; gap: 6px; justify-content: flex-end; margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.row { display: grid; grid-template-columns: 190px 1fr; gap: 10px; align-items: start; padding: 5px 0; border-bottom: 1px solid #ffffff08; }
.row > label { color: var(--text); padding-top: 5px; }
.row > div { min-width: 0; }   /* a wide field never pushes the page sideways */
.row .hint { color: var(--dim); font-size: 12px; margin-top: 3px; max-width: 90ch; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }   /* a row of controls, in a form row or on its own */
.row .unit { color: var(--dim); font-size: 12px; }
.row.changed > label::after { content: " ●"; color: var(--accent2); }
.split { display: grid; grid-template-columns: 250px 1fr; gap: 16px; }
.split > * { min-width: 0; }   /* a wide child (a note grid) scrolls inside its form instead of widening the page */
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); max-height: calc(100vh - 150px); overflow: auto; }
.list .item { padding: 7px 10px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid #ffffff08; gap: 6px; }
.list .item:hover { background: var(--panel2); }
.list .item.on { background: var(--panel2); box-shadow: inset 3px 0 var(--accent2); }
.list .item small { color: var(--dim); }
.list .tools { padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--panel); }
.problems { list-style: none; padding: 0; margin: 0; }
.problems li { padding: 5px 8px; border-left: 3px solid var(--bad); background: var(--panel); margin-bottom: 4px; border-radius: 0 5px 5px 0; cursor: pointer; }
.problems li:hover { background: var(--panel2); }
.problems li b { color: var(--bad); }
.mods { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
.mod { display: flex; gap: 8px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
.mod.off { opacity: .6; } .mod small { color: var(--dim); display: block; }
table.t { border-collapse: collapse; width: 100%; } table.t th { text-align: left; color: var(--dim); font-weight: 500; font-size: 12px; padding: 2px 6px; } table.t td { padding: 2px 4px; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--panel2); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; z-index: 10; max-width: 420px; }
.tag { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px; margin: 1px 3px 1px 0; font-size: 12px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; } .kv b { color: var(--dim); font-weight: 500; }
.dim { color: var(--dim); }
@media (max-width: 760px) { #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 48px auto 1fr; } header { grid-column: 1; gap: 6px; padding: 0 8px; min-width: 0; } header .logo { font-size: 12px; line-height: 1.1; } #packSelect { max-width: 120px; } header .chip { padding: 2px 7px; font-size: 11px; } nav { flex-direction: row; overflow-x: auto; padding: 6px; } nav h4 { display: none; }
  .split { grid-template-columns: 1fr; } .row { grid-template-columns: 1fr; } }

.modal { position: fixed; inset: 0; background: #000a; display: grid; place-items: center; z-index: 20; }
.dlg { background: var(--panel); border: 1px solid var(--accent); border-radius: 10px; padding: 18px 20px; width: min(460px, 92vw); }
.dlg p { margin: 0 0 10px; }

.pic-thumb { display: grid; place-items: center; height: 96px; border-radius: 5px; background: repeating-conic-gradient(#1b2036 0 25%, #12162a 0 50%) 0 0 / 14px 14px; }
.pic-thumb img { max-width: 100%; max-height: 96px; object-fit: contain; }

.pic-item { align-items: center; justify-content: flex-start; }
.pic-item small { margin-left: auto; }
.pic-mini { width: 34px; height: 34px; flex: none; display: grid; place-items: center; border-radius: 4px; overflow: hidden; background: repeating-conic-gradient(#1c1f33 0% 25%, #12142a 0% 50%) 0 0 / 12px 12px; }
.pic-mini img { max-width: 100%; max-height: 100%; object-fit: contain; }
.pic-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pic-stage { display: grid; place-items: center; min-height: 160px; max-height: 360px; margin: 8px 0; padding: 10px; border: 1px solid var(--line); border-radius: 6px; overflow: auto; background: repeating-conic-gradient(#1c1f33 0% 25%, #12142a 0% 50%) 0 0 / 16px 16px; }
.pic-stage img { max-width: 100%; max-height: 320px; object-fit: contain; }

.theme-split { display: grid; grid-template-columns: minmax(0, 1fr) 460px; gap: 16px; align-items: start; }
.theme-side { position: sticky; top: 0; }
.theme-stage { zoom: .66; width: 640px; max-width: none; margin-top: 8px; }
@media (max-width: 1250px) { .theme-split { grid-template-columns: minmax(0, 1fr); } .theme-side { position: static; order: -1; } .theme-stage { zoom: 1; overflow-x: auto; width: auto; } }
.tag a { color: var(--accent); text-decoration: none; cursor: pointer; }
.tag a:hover { color: var(--accent2); }

.two-up { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 14px; align-items: start; }
.glance { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-top: 8px; }
.glance-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); text-decoration: none; }
.glance-item:hover { border-color: var(--accent); }
.glance-item b { font-size: 20px; color: var(--accent); font-weight: 600; }
.glance-item span { color: var(--dim); font-size: 12px; }
.card > .sub { margin: 12px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }

/* grouped bars: the header is a pack group and a status group; a row of choices is a segmented control */
header .hg { display: inline-flex; align-items: center; gap: 8px; padding-right: 12px; border-right: 1px solid var(--line); }
header .hg.end { border-right: 0; border-left: 1px solid var(--line); padding: 0 0 0 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.seg button { background: none; border: 0; border-radius: 6px; padding: 5px 12px; color: var(--dim); cursor: pointer; }
.seg button:hover { color: var(--text); background: var(--panel2); }
.seg button.on { background: var(--accent); color: #04121c; font-weight: 600; }
.gl { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); font-weight: 600; }
@media (max-width: 760px) { header .hg { padding-right: 6px; } header .hg.end { padding-left: 6px; } }
@media (max-width: 760px) { #app { grid-template-rows: auto auto 1fr; } header { flex-wrap: wrap; padding: 6px 8px; row-gap: 6px; } header .spacer { display: none; } header .hg.end { margin-left: auto; } header .hg { border-right: 0; padding-right: 0; } header .hg.end { border-left: 0; padding-left: 0; } }
.cgrid.three { grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); }   /* a section of three short blocks (a set's 2 / 3 / 4-piece bonuses) */
.cgrid.three .ctl > span[style*="min-width"] { min-width: 96px !important; }   /* a stat name needs less room when three editors sit side by side */
a.tag { color: var(--accent); text-decoration: none; cursor: pointer; }
a.tag:hover { border-color: var(--accent); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid #ffffff44; }

table.looks td { padding: 3px 5px; } table.looks input { background: var(--input); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; }
table.looks input.set { border-color: #5ec8ff66; color: var(--text); } table.looks input.odd { border-color: var(--warn); }
a.btn { text-decoration: none; color: var(--text); display: inline-block; }

.bargroup { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 12px; border-right: 1px solid var(--line); }
.bargroup:last-child { border-right: 0; }
.bargroup select { max-width: 280px; }

/* hero effects: Tuning card */
.subhead { font-weight: 600; color: var(--dim); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; margin: 10px 0 0; }
.row.off > label { opacity: 0.6; }
.row .hint.ok { color: var(--good, #4fe39a); }

</style>
<style>
.site-nav{display:inline-flex;gap:4px;align-items:center;margin:0 6px;flex:none}
.site-nav a{font:600 12px "Chakra Petch","Segoe UI",system-ui,sans-serif;letter-spacing:.02em;color:#8f94b8;text-decoration:none;padding:4px 9px;border:1px solid #262a45;border-radius:4px;white-space:nowrap}
.site-nav a:hover{border-color:#35d0ff;color:#e9eaf6}
.site-nav a[aria-current=page]{background:#171929;color:#35d0ff;border-color:#35d0ff}
</style></head>
<body>
<div id="app">
  <header>
    <span class="logo">SURVIVORATOR <b>STUDIO</b></span><div class="site-nav" role="navigation" aria-label="Studios"><a href="./" aria-current="page">Packs</a><a href="./weapons/">Weapons &amp; Shots</a><a href="./puppets/">Puppets</a><a href="./arena/">Arena</a></div>
    <div class="hg" role="group" aria-label="Pack">
      <select id="packSelect" title="Which game pack you are editing"></select>
      <button class="btn small" id="newPack" title="Copy this pack under a new name">New pack…</button>
    </div>
    <span class="spacer"></span>
    <div class="hg end" role="group" aria-label="Status">
      <button class="chip" id="whoBtn" title="Your name, shown next to your saves" data-nopolish>…</button>
      <span class="chip" id="problemChip" title="Problems the validator found in this pack">…</span>
      <span class="chip" id="saveChip">…</span>
    </div>
    <button class="btn primary" id="saveBtn" title="Ctrl+S">Save</button>
  </header>
  <nav id="nav"></nav>
  <main id="main"><p class="lead">Connecting to the studio database…</p></main>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const DATA = {"firebase": {"apiKey": "AIzaSyBt9shBGY0WwQABtPpLVAz-YVrO4pKmwFU", "authDomain": "survivorator-studio.firebaseapp.com", "projectId": "survivorator-studio", "storageBucket": "survivorator-studio.firebasestorage.app", "messagingSenderId": "303198919420", "appId": "1:303198919420:web:c93eef0f6dd1199c475579"}, "schema": {"format": 0, "note": "Every rules knob the engine knows: its default (today's game), its limits and what it means. game.json 'rules' and the presets may set any of these by area.knob; anything not set falls back to 'default'. The validator and (later) the studio form read this file; scripts/rules.gd reads it at run time. See design/RULES_KNOBS.md.", "areas": {"waves": {"label": "Waves and pacing", "knobs": {"length_base": {"default": 40.0, "min": 5.0, "max": 600.0, "unit": "s", "label": "Wave length, wave 1", "desc": "How many seconds wave 1 lasts. Wave N lasts “Wave length, wave 1” + “Wave length growth” × N seconds, up to “Longest wave”.", "whole": false}, "length_per_wave": {"default": 3.0, "min": 0.0, "max": 60.0, "unit": "s", "label": "Wave length growth", "desc": "Seconds added to the wave length for each wave number.", "whole": false}, "length_cap": {"default": 90.0, "min": 5.0, "max": 1200.0, "unit": "s", "label": "Longest wave", "desc": "Waves never last longer than this.", "whole": false}, "spawn_interval_start": {"default": 1.8, "min": 0.1, "max": 20.0, "unit": "s", "label": "Spawn gap, wave 1", "desc": "Seconds between spawns on wave 1 for one hero (co-op divides this by the party size).", "whole": false}, "spawn_rate_growth": {"default": 0.1, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Spawn speed-up", "desc": "How much faster spawning gets each wave. The gap is “Spawn gap, wave 1” ÷ (1 + growth × (wave − 1)).", "whole": false}, "spawn_interval_min": {"default": 0.45, "min": 0.05, "max": 10.0, "unit": "s", "label": "Fastest spawn gap", "desc": "The spawn gap never gets shorter than this.", "whole": false}, "batch_max": {"default": 4, "min": 1, "max": 20, "unit": "enemies", "label": "Most enemies per spawn", "desc": "A spawn can bring several enemies at once. The batch grows by one every “Batch growth” waves, up to this.", "whole": true}, "batch_every": {"default": 4, "min": 1, "max": 50, "unit": "waves", "label": "Batch growth", "desc": "Waves between each +1 to the spawn batch size.", "whole": true}, "crowd_cap_per_hero": {"default": 60, "min": 10, "max": 500, "unit": "enemies", "label": "Crowd cap", "desc": "Most enemies alive at once for one hero. This is also a performance limit: crowds cost more than their head count suggests.", "whole": true}, "crowd_cap_party_bonus": {"default": 30, "min": 0, "max": 500, "unit": "enemies", "label": "Crowd cap per extra hero", "desc": "Each hero beyond the first adds this to the crowd cap.", "whole": true}}}, "enemies": {"label": "Enemy growth", "knobs": {"hp_growth": {"default": 0.1, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Health growth", "desc": "Enemy health grows by this fraction of its starting health every wave (wave N: 1 + growth × (N − 1)).", "whole": false}, "hp_growth_late": {"default": 0.05, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Extra health growth (late)", "desc": "Extra health growth on top of that, for every wave after “Late growth starts after” (so health grows faster once the early waves are over).", "whole": false}, "damage_growth": {"default": 0.12, "min": 0.0, "max": 2.0, "unit": "x per wave", "label": "Damage growth", "desc": "Enemy damage (touch hits and bullets) grows by this fraction every wave after “Late growth starts after”. Bosses keep their own numbers.", "whole": false}, "late_from_wave": {"default": 2, "min": 0, "max": 100, "unit": "wave", "label": "Late growth starts after", "desc": "The extra health growth and the damage growth count the waves above this one (2 = they start on wave 3).", "whole": true}, "speed_growth": {"default": 0.06, "min": 0.0, "max": 1.0, "unit": "x per wave", "label": "Speed growth", "desc": "Enemy speed grows by this fraction every wave, up to “Speed cap”.", "whole": false}, "speed_cap": {"default": 2.2, "min": 1.0, "max": 10.0, "unit": "x", "label": "Speed cap", "desc": "Enemies never get faster than this multiple of their starting speed (before the early-wave bonus). Set it below the hero's speed and they can never catch a moving hero.", "whole": false}, "early_fade_wave": {"default": 6, "min": 2, "max": 100, "unit": "wave", "label": "Gentle-start fade", "desc": "The early-wave bonuses below are full on wave 1 and fade to nothing on this wave.", "whole": true}, "early_hp": {"default": 0.33, "min": 0.0, "max": 3.0, "unit": "x", "label": "Early health bonus", "desc": "Extra enemy health on wave 1 (it fades out). Early waves are made tougher so that a hero standing still cannot ignore them; 0 = none.", "whole": false}, "early_speed": {"default": 0.15, "min": 0.0, "max": 3.0, "unit": "x", "label": "Early speed bonus", "desc": "Extra enemy speed on wave 1 (it fades out); 0 = none.", "whole": false}, "early_spawn_rate": {"default": 0.64, "min": 0.0, "max": 5.0, "unit": "x", "label": "Early spawn bonus", "desc": "Extra spawn rate on wave 1 (it fades out); 0 = none.", "whole": false}, "elite_chance_scale": {"default": 1.0, "min": 0.0, "max": 10.0, "unit": "x", "label": "Elite chance scale", "desc": "Multiplies every kind's elite chance (0 = no elites at all, 2 = twice as many). Only kinds that define an elite version ever spawn elites.", "whole": false}}}, "bosses": {"label": "Bosses", "knobs": {"hp_per_extra_hero": {"default": 0.8, "min": 0.0, "max": 5.0, "unit": "x per hero", "label": "Boss health per extra hero", "desc": "In co-op, a boss has this much more health for every hero beyond the first (0.8 = +80%).", "whole": false}, "hp_per_loop": {"default": 0.25, "min": 0.0, "max": 5.0, "unit": "x per loop", "label": "Boss health per repeat", "desc": "Each time the boss list has been used up and starts again, the bo const isNum = x => typeof x === "number" && !Number.isNaN(x);
const isObj = x => x !== null && typeof x === "object" && !Array.isArray(x);
const num = (x, d) => (x === undefined || x === null ? d : x);

function checkRules(where, block, knobs, err, C, abilityIds) {
  if (!isObj(block)) { err("game.json", `${where} must be an object of areas`); return; }
  for (const [area, vals] of Object.entries(block)) {
    if (!isObj(vals)) { err("game.json", `${where}.${area} must be an object of knobs`); continue; }
    for (const [k, v] of Object.entries(vals)) {
      const path = `${area}.${k}`;
      const spec = knobs[path];
      if (!spec) err("game.json", `${where}: unknown rule '${path}'`);
      else if (spec.type === "text") {
        if (typeof v !== "string") err("game.json", `${where}: rule '${path}' must be text (got ${JSON.stringify(v)})`);
        else if (path === "hero.ability_default" && abilityIds && v !== "" && !abilityIds.includes(v)) err("game.json", `${where}: rule '${path}' = '${v}' is not an ability in abilities.json`);
      } else if (spec.type === "choice") {
        if (!spec.options.includes(v)) err("game.json", `${where}: rule '${path}' must be one of ${spec.options.join(", ")} (got ${JSON.stringify(v)})`);
      } else if (spec.type === "list") {
        const ok = Array.isArray(v) && (spec.length === null || v.length === spec.length) && v.every(x => isNum(x) && spec.min <= x && x <= spec.max);
        if (!ok) err("game.json", `${where}: rule '${path}' must be a list of ${spec.length !== null ? spec.length : "any number of"} numbers between ${spec.min} and ${spec.max}`);
      } else if (spec.type === "budget") {
        if (!isObj(v)) err("game.json", `${where}: rule '${path}' must be an object of lanes`);
        else for (const [lane, rows] of Object.entries(v)) {
          if (!(lane in spec.default)) { err("game.json", `${where}: rule '${path}': unknown lane '${lane}'`); continue; }
          let good = Array.isArray(rows) && rows.length > 0 && rows.every(r => Array.isArray(r) && r.length === 2 && r.every(isNum) && r[0] >= 1 && spec.min <= r[1] && r[1] <= spec.max);
          if (good) for (let i = 0; i < rows.length - 1; i++) if (rows[i][0] >= rows[i + 1][0]) good = false;
          if (!good) err("game.json", `${where}: rule '${path}.${lane}' must be rows of [wave, number] with the waves increasing`);
        }
      } else if (spec.type === "stats") {
        if (!isObj(v)) err("game.json", `${where}: rule '${path}' must be an object of stat: number`);
        else for (const [sk, sv] of Object.entries(v)) {
          if (!C.stats.includes(sk)) err("game.json", `${where}: rule '${path}': unknown stat '${sk}'`);
          else if (!isNum(sv)) err("game.json", `${where}: rule '${path}.${sk}' must be a number (got ${JSON.stringify(sv)})`);
        }
      } else if (!isNum(v)) err("game.json", `${where}: rule '${path}' must be a number (got ${JSON.stringify(v)})`);
      else if (!(spec.min <= v && v <= spec.max)) err("game.json", `${where}: rule '${path}' = ${v} is outside ${spec.min} .. ${spec.max}`);
      else if (spec.whole && !Number.isInteger(v)) err("game.json", `${where}: rule '${path}' must be a whole number (got ${v})`);
    }
  }
}

function recordingProblems(who, d, allowed) {
  const out = [];
  for (const [k, v] of Object.entries(d)) {
    if (!allowed.includes(k)) out.push(`${who}: unknown setting ${pyRepr(k)}`);

/* design/UI_FORMAT.md: the theme and screens of a ui.json (or the built-in ui_default.json). `colors` = every colour name a screen may use, `modules` = the module names. */
function validateUi(ui, where, colors, modules) {
  const errs = [];
  const err = msg => errs.push(`${where}: ${msg}`);
  const th = isObj(ui.theme) ? ui.theme : {};
  if (ui.theme !== undefined && !isObj(ui.theme)) err("theme must be an object");
  for (const [k, v] of Object.entries(th.colors || {})) if (typeof v !== "string" || !UI_HEX.test(v)) err(`theme colour '${k}': ${JSON.stringify(v)} is not a #rrggbb / #rrggbbaa colour`);
  for (const [k, v] of Object.entries(th.fonts || {})) {
    if (!UI_FONTS.includes(k)) err(`theme font '${k}' is not one of ${[...UI_FONTS].sort().join(", ")}`);
    else if (!isNum(v) || v < 6 || v > 200) err(`theme font '${k}' must be a size from 6 to 200`);
  }
  for (const blk of ["panel", "button"]) for (const [k, v] of Object.entries(th[blk] || {})) if (!isNum(v) || v < 0) err(`theme ${blk}.${k} must be a number, 0 or more`);
  const screens = ui.screens === undefined ? {} : ui.screens;
  if (!isObj(screens)) { err("screens must be an object"); return errs; }
  const colorOk = c => c === "" || colors.has(c) || (typeof c === "string" && UI_HEX.test(c));

    const w = `screen '${sid}'`;
    if (!isObj(sc) || !Array.isArray(sc.elements)) { err(`${w}: needs an elements list`); continue; }
    if ("layer" in sc && !Number.isInteger(sc.layer)) err(`${w}: layer must be a whole number`);
    const ctx = new Set(Object.keys(sc.context || {}));
    const gvars = new Set(Object.keys(C.ui_vars.globals));
    const locals = new Set(Array.isArray(sc.locals) ? sc.locals : []);   // names the host passes when it builds a line itself with UiScreen.say()
    let texts = sc.texts === undefined ? {} : sc.texts;
    if (!isObj(texts)) { err(`${w}: texts must be an object of key: wording`); texts = {}; }
    const checkNames = (text, wel, inRepeat, inTexts) => {
      for (const mm of text.matchAll(/\{(\$?[a-z_0-9.]+)\}/g)) {
        const name = mm[1];
        if (name.startsWith("$")) {
          const key = name.slice(1);
          if (key.startsWith("item.")) { if (!inRepeat && !inTexts) err(`${wel}: {${name}} only works inside a repeat template`); }
          else if (!ctx.has(key) && !gvars.has(key) && !(key in texts)) err(`${wel}: {${name}} is not in the screen's wording table or context list`);
        } else if (name.startsWith("item.")) { if (!inRepeat && !inTexts) err(`${wel}: {${name}} only works inside a repeat template`); }
        else if (!ctx.has(name) && !gvars.has(name) && !(inTexts && locals.has(name))) err(`${wel}: {${name}} is not in the screen's context list or the standard variables`);
      }

        else for (const g of groups) for (const sid of g) if (!setIds.has(sid)) err("achievements.json", `${a.id}: group names unknown gear set ${JSON.stringify(sid)}`);
      }
    }
    for (const r of a.rewards || []) {
      if (!C.reward_categories.includes(r.category)) err("achievements.json", `${a.id}: unknown reward category ${JSON.stringify(r.category)}`);
      else if (!cats[r.category].has(r.id)) err("achievements.json", `${a.id}: reward ${r.category}/${r.id} does not exist`);
    }
    const c = a.cond || {};
    if (c.type === "villain" && !bossIds.includes(c.villain)) err("achievements.json", `${a.id}: villain ${JSON.stringify(c.villain)} is not a boss`);
    if (c.type === "wave" && c.archetype && !heroes.has(c.archetype)) err("achievements.json", `${a.id}: archetype '${c.archetype}' is not a hero`);
  }
  if (new Set(achIds).size !== achIds.length) err("achievements.json", "an achievement id appears twice");
  for (const key of Object.keys(pack.fusion.recipes || {})) {
    const parts = key.split("+");
    const sorted = [...parts].sort();
    if (parts.length !== 2 || parts.join("+") !== sorted.join("+")) err("fusion.json", `recipe key '${key}' must be two power ids joined by '+', in alphabetical order`);
    else for (const p of parts) if (!powers.has(p)) err("fusion.json", `recipe ${key}: '${p}' is not a power`);
  }
  for (const pid of Object.keys(pack.fusion.fragments || {})) if (!powers.has(pid)) err("fusion.json", `fragments: '${pid}' is not a power`);
  // the menus: the built-in ui_default.json is always checked, the pack's own ui.json when it has one
  {
    const colors = new Set(Object.keys(C.ui_default.theme.colors));
    const mine = pack.ui;
    if (isObj(mine)) for (const k of Object.keys((mine.theme || {}).colors || {})) colors.add(k);
    const mods = new Set(C.modules.names);
    errs.push(...validateUi(C.ui_default, "data/ui_default.json", colors, mods));
    if (isObj(mine)) errs.push(...validateUi(mine, "ui.json", colors, mods));
    else if ("ui" in pack) err("ui.json", "not a JSON object");
  }
  if (isObj(pack.audio)) {
    const au = pack.audio, eventsKnown = C.audio_events.events;
    let sounds = au.sounds === undefined ? {} : au.sounds;
    if (!isObj(sounds)) { err("audio.json", "sounds must be an object of id: sound"); sounds = {}; }
    for (const [k, v] of Object.entries(au.volumes || {})) {
      if (!["master", "music", "sfx"].includes(k)) err("audio.json", `volumes: unknown bus ${pyRepr(k)} (master, music, sfx)`);
      else if (!isNum(v) || v < 0 || v > 1) err("audio.json", `volumes.${k} must be a number from 0 to 1`);
    }
    for (const [sid, s] of Object.entries(sounds)) {
      const w = `sound '${sid}'`;
      if (!/^[a-z0-9_]+$/.test(sid)) err("audio.json", `${w}: the id must be lowercase letters, digits and underscores`);
      if (!isObj(s)) { err("audio.json", `${w}: must be an object`); continue; }
      const kind = s.kind === undefined ? "synth" : s.kind;
      if (kind === "file") {
        if (typeof s.file !== "string" || !/\.(wav|mp3|ogg)$/i.test(s.file)) err("audio.json", `${w}: a file sound needs 'file' (a .wav, .mp3 or .ogg path in the pack folder)`);
        for (const m of recordingProblems(w, s, ["kind", "file", "gain", "src"])) err("audio.json", m);
        continue;
      }
      if (kind !== "synth") { err("audio.json", `${w}: kind must be synth or file`); continue; }
      for (const [k, v] of Object.entries(s)) {
        if (k === "kind") continue;
        if (k === "wave") { if (!SYNTH_WAVES.includes(v)) err("audio.json", `${w}: wave must be one of ${SYNTH_WAVES.join(", ")}`); }
        else if (k === "arp") { if (!(Array.isArray(v) && v.length <= 16 && v.every(x => isNum(x) && x >= -36 && x <= 36))) err("audio.json", `${w}: arp must be a list of up to 16 semitone offsets from -36 to 36`); }
        else if (k === "seed") { if (!Number.isInteger(v)) err("audio.json", `${w}: seed must be a whole number`); }
        else if (k in SYNTH_RANGES) { const [lo, hi] = SYNTH_RANGES[k]; if (!isNum(v) || v < lo || v > hi) err("audio.json", `${w}: ${k} must be a number from ${lo} to ${hi}`); }
        else err("audio.json", `${w}: unknown setting ${pyRepr(k)}`);
      }
    }
    for (const [ename, c] of Object.entries(au.events || {})) {
      const w = `event '${ename}'`;
      if (!(ename in eventsKnown)) { err("audio.json", `${w}: the game has no such event`); continue; }
      if (!isObj(c)) { err("audio.json", `${w}: must be an object`); continue; }
      const ids = Array.isArray(c.sound) ? c.sound : [c.sound];
      if (!ids.length || !ids.every(i => typeof i === "string")) err("audio.json", `${w}: sound must be a sound id or a list of them`);
      else for (const i of ids) if (!(i in sounds)) err("audio.json", `${w}: plays '${i}', which is not a sound`);
      for (const [k, v] of Object.entries(c)) {
        if (k === "sound") continue;
        if (k === "voices") { if (!Number.isInteger(v) || v < 0 || v > 16) err("audio.json", `${w}: voices must be a whole number from 0 to 16`); }
        else if (k in EVENT_RANGES) { const [lo, hi] = EVENT_RANGES[k]; if (!isNum(v) || v < lo || v > hi) err("audio.json", `${w}: ${k} must be a number from ${lo} to ${hi}`); }
        else err("audio.json", `${w}: unknown setting ${pyRepr(k)}`);
      }
    }
    const mu = au.music;
    if (mu !== undefined && mu !== null) {
      if (!isObj(mu)) err("audio.json", "music must be an object");
      else {
        let tracks = mu.tracks === undefined ? {} : mu.tracks;
        if (!isObj(tracks)) { err("audio.json", "music.tracks must be an object of id: track"); tracks = {}; }
        if (mu.fade !== undefined && (!isNum(mu.fade) || mu.fade < 0 || mu.fade > 8)) err("audio.json", "music.fade must be a number from 0 to 8 (seconds)");
        const fa = mu.fight_at;
        if (fa !== undefined && !(Array.isArray(fa) && fa.length === 2 && fa.every(x => Number.isInteger(x) && x >= 1) && fa[0] <= fa[1])) err("audio.json", "music.fight_at must be two wave numbers, e.g. [5, 10] (where fight_2 and fight_3 start)");
        const mctx = C.audio_events.music;
        for (const [ctx, tid] of Object.entries(mu.contexts || {})) {
          if (!(ctx in mctx)) err("audio.json", `music context '${ctx}': the game has no such context (${Object.keys(mctx).join(", ")})`);
          else if (tid !== "" && !(tid in tracks)) err("audio.json", `music context '${ctx}': plays '${tid}', which is not a track`);
        }
        for (const [tid, tr] of Object.entries(tracks)) {
          const w = `track '${tid}'`;
          if (!/^[a-z0-9_]+$/.test(tid)) err("audio.json", `${w}: the id must be lowercase letters, digits and underscores`);
          if (!isObj(tr)) { err("audio.json", `${w}: must be an object`); continue; }
          if ("loop" in tr && typeof tr.loop !== "boolean") err("audio.json", `${w}: loop must be true or false`);
          if ("file" in tr) {
            if (typeof tr.file !== "string" || !/\.(wav|mp3|ogg)$/i.test(tr.file)) err("audio.json", `${w}: file must be a .wav, .mp3 or .ogg path in the pack folder`);
            for (const m of recordingProblems(w, tr, ["file", "loop", "start", "loop_start", "gain", "src"])) err("audio.json", m);
            continue;
          }
          for (const [k, v] of Object.entries(tr)) {
            if (k === "loop" || k === "channels") continue;
            if (k in TRACK_RANGES) {
              const [lo, hi] = TRACK_RANGES[k], whole = k === "steps" || k === "steps_per_beat";
              if (!isNum(v) || v < lo || v > hi || (whole && !Number.isInteger(v))) err("audio.json", `${w}: ${k} must be ${whole ? "a whole number" : "a number"} from ${lo} to ${hi}`);
            } else err("audio.json", `${w}: unknown setting ${pyRepr(k)}`);
          }
          const chans = tr.channels === undefined ? [] : tr.channels;
          if (!Array.isArray(chans) || chans.length > 12) { err("audio.json", `${w}: channels must be a list of up to 12`); continue; }
          chans.forEach((ch, ci) => {
            const cw = `${w} channel ${ci + 1}`;
            if (!isObj(ch)) { err("audio.json", `${cw}: must be an object`); return; }
            const wave = ch.wave === undefined ? "square" : ch.wave;
            if (!CHANNEL_WAVES.includes(wave)) err("audio.json", `${cw}: wave must be one of ${CHANNEL_WAVES.join(", ")}`);
            for (const [k, v] of Object.entries(ch)) {
              if (k === "wave" || k === "pattern") continue;
              if (k === "seed") { if (!Number.isInteger(v)) err("audio.json", `${cw}: seed must be a whole number`); }
              else if (k in CHANNEL_RANGES) {
                const [lo, hi] = CHANNEL_RANGES[k];
                if (!isNum(v) || v < lo || v > hi || (k === "octave" && !Number.isInteger(v))) err("audio.json", `${cw}: ${k} must be ${k === "octave" ? "a whole number" : "a number"} from ${lo} to ${hi}`);
              } else err("audio.json", `${cw}: unknown setting ${pyRepr(k)}`);
            }
            const pat = ch.pattern === undefined ? "" : ch.pattern;
            if (typeof pat !== "string") err("audio.json", `${cw}: pattern must be text of notes separated by spaces`);
            else for (const tok of pat.split(/\s+/).filter(x => x)) {
              const ok = tok === "." || (wave === "drums" ? ["k", "s", "h"].includes(tok.toLowerCase()) : NOTE_TOKEN.test(tok));
              if (!ok) { err("audio.json", `${cw}: '${tok}' is not a ${wave === "drums" ? "drum hit (k, s, h)" : "note like C4, F#3, Bb2"} or a rest (.)`); break; }
            }
          });
        }
      }
    }
  } else if ("audio" in pack) err("audio.json", "not a JSON object");
  if (isObj(pack.meta)) {
    const seenIds = new Set();
    const catsM = { archetypes: heroes, powers, gear_sets: setIds, fusion_recipes: recipeKeys };
    for (const it of pack.meta.items || []) {
      const iid = it.id;
      if (typeof iid !== "string" || !iid) err("meta.json", "an item has no id");
      else if (seenIds.has(iid)) err("meta.json", `item id '${iid}' appears twice`);
      seenIds.add(iid);
      const w = `item '${iid === undefined ? "None" : iid}'`;
      if (typeof it.name !== "string" || !it.name) err("meta.json", `${w}: needs a name`);
      const kind = it.kind;
      if (!META_KINDS.includes(kind)) err("meta.json", `${w}: unknown kind ${pyRepr(kind)} (the kinds are: ${META_KINDS.join(", ")})`);
      const ml = it.max_level === undefined ? 1 : it.max_level;
      if (!Number.isInteger(ml) || ml < 1) err("meta.json", `${w}: max_level must be a whole number, 1 or more`);
      if (!isNum(it.cost) || it.cost < 0) err("meta.json", `${w}: cost must be a number, 0 or more`);
      const gr = it.growth === undefined ? 1.0 : it.growth;
      if (!isNum(gr) || gr < 1) err("meta.json", `${w}: growth must be a number, 1 or more (each level costs this much more)`);
      if (kind === "stat") {
        if (!C.stats.includes(it.stat)) err("meta.json", `${w}: unknown stat ${pyRepr(it.stat)}`);
        if (!isNum(it.amount) || it.amount === 0) err("meta.json", `${w}: amount must be a number other than 0`);
      } else if (kind === "unlock") {
        if (!(it.category in catsM)) err("meta.json", `${w}: unknown category ${pyRepr(it.category)} (the categories are: ${[...C.reward_categories].sort().join(", ")})`);
        else if (!catsM[it.category].has(it.target)) err("meta.json", `${w}: unlocks ${it.category}/${it.target === undefined ? "None" : it.target}, which does not exist`);
      } else if (kind === "run_mod") {
        if (!META_MODS.includes(it.mod)) err("meta.json", `${w}: unknown mod ${pyRepr(it.mod)} (the mods are: ${META_MODS.join(", ")})`);
        if (!isNum(it.amount) || !(it.amount > 0)) err("meta.json", `${w}: amount must be a number above 0`);
      } else if (kind === "cosmetic") {
        if (typeof it.flag !== "string" || !it.flag) err("meta.json", `${w}: a cosmetic needs a flag name`);
      }
    }
  } else if ("meta" in pack) err("meta.json", "not a JSON object");
  for (const hid of Object.keys(pack.hero_effects.profiles || {})) if (!heroes.has(hid)) err("hero_effects.json", `profile for '${hid}' which is not a hero`);
  for (const [hid, sid] of Object.entries(pack.shop.own_set || {})) {
    if (!heroes.has(hid)) err("shop.json", `own_set: '${hid}' is not a hero`);
    if (!setIds.has(sid)) err("shop.json", `own_set: '${sid}' is not a gear set`);
  }
  return errs;
}

/* The shared IMAGE LIBRARY of the art studios: upload a picture (png / jpg / webp / gif), cut out the part you want (crop, remove the background, erase / restore with a brush, lasso), keep its PNG
   transparency, and use it as a part of a puppet (and, later, a weapon, a menu, the arena). Pictures live in the cloud collection `images` (images/<name>.png = {size, chunks, w, h, mime, updated, by},
   the PNG as base64 text in images/<name>.png/chunks/0000 ... because a Firestore document holds 1 MiB) and `py tools/studio/sync_images.py pull` writes them to art/library/ for the game.
   A host page calls imgBind({db: () => db, collection, doc, getDocs, setDoc, deleteDoc}) once, then uses imgPicker() / imgUrl(). */

const IMG_CHUNK = 900000;                // base64 characters per chunk document (sync_images.py uses the same number)
const IMG_MAX_BYTES = 3 * 1024 * 1024;   // the biggest PNG the library stores
const IMG = { pickerDraw: null, fs: null, files: null, urls: {}, fetching: {}, onChange: () => {}, loading: null, user: () => "someone" };

function imgBind(fs) { IMG.fs = fs; }
function imgNotify(name) { IMG.onChange(name); if (IMG.pickerDraw) IMG.pickerDraw(); }
const imgSlug = s => String(s).toLowerCase().replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "");
const imgKb = n => n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";

async function imgList(force) {
  if (IMG.files && !force) return IMG.files;
  if (IMG.loading && !force) return IMG.loading;
  IMG.loading = (async () => {
    const out = {};
    if (IMG.fs && IMG.fs.db()) {
      const snap = await IMG.fs.getDocs(IMG.fs.collection(IMG.fs.db(), "images"));
      snap.docs.forEach(d => { const x = d.data(); out[d.id] = { size: x.size || 0, chunks: x.chunks || 0, w: x.w || 0, h: x.h || 0 }; });
    }
    IMG.files = out; IMG.loading = null; return out;
  })();
  return IMG.loading;
}
/* a picture's data URL, or null while it is being fetched (IMG.onChange() runs when it arrives) */
function imgUrl(name) {
  if (IMG.urls[name]) return IMG.urls[name];
  if (!name || IMG.fetching[name] || !IMG.fs || !IMG.fs.db()) return null;
  IMG.fetching[name] = true;
  IMG.fs.getDocs(IMG.fs.collection(IMG.fs.db(), "images", name, "chunks")).then(snap => {
    const b64 = snap.docs.sort((a, b) => (a.id < b.id ? -1 : 1)).map(d => d.data().data).join("");
    if (b64) IMG.urls[name] = "data:image/png;base64," + b64;
    delete IMG.fetching[name]; imgNotify(name);
  }).catch(e => { delete IMG.fetching[name]; console.error(e); });
  return null;
}
async function imgPut(name, blob, w, h, progress) {
  const u8 = new Uint8Array(await blob.arrayBuffer());
  if (u8.length > IMG_MAX_BYTES) throw new Error(`${name} is ${imgKb(u8.length)}: over the ${imgKb(IMG_MAX_BYTES)} limit (cut it smaller)`);
  let s = ""; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  const b64 = btoa(s), n = Math.max(1, Math.ceil(b64.length / IMG_CHUNK)), fs = IMG.fs, db = fs.db();
  for (let i = 0; i < n; i++) { await fs.setDoc(fs.doc(db, "images", name, "chunks", String(i).padStart(4, "0")), { data: b64.slice(i * IMG_CHUNK, (i + 1) * IMG_CHUNK) }); if (progress) progress(i + 1, n); }
  const old = IMG.files && IMG.files[name];
  if (old) for (let i = n; i < old.chunks; i++) await fs.deleteDoc(fs.doc(db, "images", name, "chunks", String(i).padStart(4, "0")));
  await fs.setDoc(fs.doc(db, "images", name), { size: u8.length, chunks: n, w, h, mime: "image/png", updated: new Date().toISOString(), by: IMG.user() });
  IMG.files = IMG.files || {}; IMG.files[name] = { size: u8.length, chunks: n, w, h };
  IMG.urls[name] = "data:image/png;base64," + b64;
  imgNotify(name);
}
async function imgRemove(name) {
  const meta = (IMG.files || {})[name], fs = IMG.fs, db = fs.db();
  for (let i = 0; i < (meta ? meta.chunks : 0); i++) await fs.deleteDoc(fs.doc(db, "images", name, "chunks", String(i).padStart(4, "0")));
  await fs.deleteDoc(fs.doc(db, "images", name));
  if (IMG.files) delete IMG.files[name]; delete IMG.urls[name];
}
/* a picture as a loaded <img> (for drawing in a canvas) */
function imgLoad(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("that file is not a picture the browser can read")); i.src = src; }); }

// ---------------------------------------------------------------- the small DOM kit and the style
function ih(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v === false || v === null || v === undefined) continue; if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (k === "value") e.value = v; else if (k === "checked") e.checked = !!v; else e.setAttribute(k, v === true ? "" : v); }

  return e;
}

function imgModal(build) {
  return new Promise(resolve => {
    const back = ih("div", { class: "imglib-back" }), box = ih("div", { class: "imglib-box" });
    back.append(box); document.body.append(back);
    const close = v => { back.remove(); resolve(v); };
    back.addEventListener("mousedown", e => { if (e.target === back && !box.__locked) close(null); });
    build(box, close);
  });
}

// ---------------------------------------------------------------- the picker (the library)
/* Pick a picture from the library (opts.pick = true), or just manage it. Resolves the chosen name, or null. */
async function imgPicker(opts = {}) {
  return imgModal(async (box, close) => {
    const grid = ih("div", { class: "imglib-grid" }), status = ih("span", { class: "imglib-dim" }, "");
    const search = ih("input", { type: "text", placeholder: "search…", style: "width:160px" });
    const fileIn = ih("input", { type: "file", accept: "image/*", multiple: true, style: "display:none" });
    const draw = async () => {
      grid.innerHTML = "";
      let files = {};
      try { files = await imgList(); } catch (e) { status.textContent = "Could not read the library: " + e.message; }
      const q = search.value.trim().toLowerCase();
      const names = Object.keys(files).filter(n => !q || n.includes(q)).sort();
      if (!names.length) grid.append(ih("p", { class: "imglib-dim" }, Object.keys(files).length ? "No picture matches." : "The library is empty: upload a picture."));
      for (const n of names) {

function channelCard(tr, ch, ci, f) {

  if (others.length) list.append(h("div", { class: "item" + (sel && sel.k === "__other" ? " on" : ""), onclick: async () => { S.sel.item = { file, k: "__other" }; renderMain(); } }, h("span", {}, "other fields"), h("small", {}, others.map(o => o[0]).join(", "))));
  const editor = h("div", {});
  const cur = sel || (picks[0] ? { file, k: picks[0].k, i: picks[0].kind === "list" ? 0 : Object.keys(data[picks[0].k])[0], kind: picks[0].kind } : { file, k: "__other" });
  if (cur.k === "__other") {
    const sub = {}; for (const [k, v] of others) sub[k] = v;
    editor.append(genericEditor(data, file, { only: others.map(o => o[0]), card: "Fields" }));
  } else {
    const container = cur.kind === "list" ? data[cur.k] : data[cur.k];
    const item = container[cur.i];
    if (item) {
      editor.append(h("div", { class: "ctl", style: "margin-bottom:8px" }, h("b", {}, `${cur.k}[${cur.i}]`), item.name || item.id ? h("span", { class: "dim", "data-nopolish": "" }, item.name || item.id) : null, h("span", { style: "flex:1" }),
        h("button", { class: "btn small", onclick: async () => { if (cur.kind === "list") { container.splice(cur.i + 1, 0, clone(item)); S.sel.item = { ...cur, i: cur.i + 1 }; } else { const n = slug(await ask("Key for the copy:") || ""); if (!n || container[n]) return; container[n] = clone(item); S.sel.item = { ...cur, i: n }; } touch(file); renderMain(); } }, "Copy"),
        h("button", { class: "btn small danger", onclick: async () => { if (!await sure("Delete this entry?")) return; if (cur.kind === "list") container.splice(cur.i, 1); else delete container[cur.i]; S.sel.item = null; touch(file); renderMain(); } }, "Delete")));
      editor.append(genericEditor(item, file, { path: cur.k, card: "Fields" }));
    }
    editor.append(h("button", { class: "btn small", style: "margin-top:10px", onclick: async () => { if (cur.kind === "list") { const proto = clone(container[container.length - 1] || {}); if (proto.id) proto.id = proto.id + "_2"; container.push(proto); S.sel.item = { ...cur, i: container.length - 1 }; } else { const n = slug(await ask("Key for the new entry:") || ""); if (!n || container[n]) return; container[n] = clone(Object.values(container)[0] || {}); S.sel.item = { ...cur, i: n }; } touch(file); renderMain(); } }, "+ Add " + (cur.kind === "list" ? "an entry" : "a keyed entry")));
  }
  wrap.append(h("div", { class: "split" }, list, editor));
  return wrap;
}

// the recursive editor: objects, lists, numbers, text, switches; known keys get pickers
function genericEditor(value, file, o = {}) {
  const wrap = o.card ? h("details", { class: "card", open: true }, h("summary", {}, o.card)) : h("div", {});
  const re = () => renderMain();
  if (isObjV(value)) {
    for (const [k, v] of Object.entries(value)) {
      if (o.only && !o.only.includes(k)) continue;
      wrap.append(fieldRow(value, k, v, file, re));
    }
    wrap.append(addFieldBar(value, file, re));
  } else wrap.append(h("p", {}, JSON.stringify(value)));
  return wrap;
}
function fieldRow(obj, k, v, file, re) {
  const del = h("button", { class: "btn small", title: "Remove this field", onclick: async () => { delete obj[k]; touch(file); re(); } }, "✕");
  const hint = HINTS[k];
  if (hint && (typeof v === "string")) return row(k, [selectField(obj, k, file, hint(), {}), del]);
  if (typeof v === "number") return row(k, [numField(obj, k, file, {}), del]);
  if (typeof v === "boolean") return row(k, [boolField(obj, k, file), del]);
  if (typeof v === "string") return row(k, [/^#[0-9a-f]{6}$/i.test(v) ? colorField(obj, k, file, { after: re }) : textField(obj, k, file), del]);
  if (Array.isArray(v)) {
    if (v.every(x => typeof x === "string" || typeof x === "number")) {
      const t = h("input", { type: "text", style: "width:420px" });
      t.value = v.join(", ");
      const numeric = v.length > 0 && v.every(x => typeof x === "number");
      t.addEventListener("change", () => { const parts = t.value.split(",").map(s => s.trim()).filter(s => s !== ""); obj[k] = numeric ? parts.map(Number) : parts; touch(file); });
      return row(k, [t, del], "comma separated");
    }
    if (v.every(isObjV)) {
      const box = h("div", {});
      v.forEach((it, i) => box.append(h("details", { class: "card" }, h("summary", {}, `${k}[${i}]`, it.name || it.id ? "  " + (it.name || it.id) : ""), genericEditor(it, file), h("button", { class: "btn small danger", onclick: async () => { v.splice(i, 1); touch(file); re(); } }, "Remove this one"))));
      box.append(h("button", { class: "btn small", onclick: async () => { v.push(clone(v[v.length - 1] || {})); touch(file); re(); } }, "+ add"));
      return row(k, [box, del]);
    }
    const t = h("input", { type: "text", style: "width:520px" });
    t.value = JSON.stringify(v);
    t.addEventListener("change", () => { try { obj[k] = JSON.parse(t.value); t.classList.remove("bad"); touch(file); } catch (e) { t.classList.add("bad"); } });
    return row(k, [t, del], "JSON");
  }
  if (isObjV(v)) return row(k, [h("details", { class: "card", style: "flex:1;min-width:300px", open: Object.keys(v).length < 9 }, h("summary", {}, `${Object.keys(v).length} fields`), genericEditor(v, file)), del]);
  return row(k, [h("span", { class: "dim" }, "null"), del]);
}
function addFieldBar(obj, file, re) {
  const name = h("input", { type: "text", placeholder: "new field name", style: "width:160px" });
  const type = h("select", {}, ["number", "text", "yes/no", "list", "group"].map(t => h("option", { value: t }, t)));
  return h("div", { class: "ctl", style: "margin-top:8px" }, name, type, h("button", { class: "btn small", onclick: async () => { const n = name.value.trim(); if (!n || n in obj) return; obj[n] = { number: 0, text: "", "yes/no": false, list: [], group: {} }[type.value]; touch(file); re(); } }, "+ field"));
}

// ---- problems
const FILE_TAB = { game: "rules", enemies: "enemies", abilities: "abilities", heroes: "heroes", powers: "powers", gear: "gear", talents: "talents", achievements: "achievements", bosses: "bosses", ui: "menus", meta: "meta", fusion: "fusion", looks: "looks", hero_effects: "effects", shop: "shop" };
/* for a problem in one of these files: which item it is about, so a click opens that item, not only the tab */
const ITEM_NAV = {
  heroes: { ids: () => ids("heroes", "heroes"), pick: id => { S.sel.hero = id; } },
  powers: { ids: () => ids("powers", "powers"), pick: id => { S.sel.power = id; } },
  abilities: { ids: () => ids("abilities", "abilities"), pick: id => { S.sel.ability = id; } },
  bosses: { ids: () => ids("bosses", "bosses"), pick: id => { S.sel.boss = id; } },
  enemies: { ids: () => Object.keys((S.files.enemies || {}).kinds || {}), pick: id => { S.sel.enemy = id; } },
  gear: { ids: () => Object.keys((S.files.gear || {}).sets || {}), pick: id => { S.sel.gearSet = id; } },
  fusion: { ids: () => Object.keys((S.files.fusion || {}).recipes || {}), pick: id => { S.sel.recipe = id; } },
  hero_effects: { ids: () => Object.keys((S.files.hero_effects || {}).profiles || {}), pick: id => { S.sel.fxHero = id; } },
  meta: { ids: () => ((S.files.meta || {}).items || []).map(x => x.id), pick: id => { S.sel.metaItem = id; } },
  achievements: { ids: () => ((S.files.achievements || {}).achievements || []).map(x => x.id), pick: id => { S.sel.ach = ((S.files.achievements || {}).achievements || []).findIndex(x => x.id === id); } },
  talents: { ids: () => ((S.files.talents || {}).talents || []).map(x => x.name), pick: id => { S.sel.talent = ((S.files.talents || {}).talents || []).findIndex(x => x.name === id); } },
};
/* the item a problem line is about ("heroes.json: scout: needs a puppet" -> scout), or null */
function problemItem(file, line) {
  const nav = ITEM_NAV[file]; if (!nav) return null;
  const body = line.slice(line.indexOf(".json") + 7);   // after "file.json: "
  const have = new Set(nav.ids());
  const cands = [body.split(": ")[0].replace(/^(hero|power|boss|ability|item|enemy|kind|set|recipe|talent)\s+/, ""), ...[...body.matchAll(/'([^']+)'/g)].map(m => m[1])];
  const hit = cands.find(c => have.has(c));
  return hit === undefined ? null : hit;
}
function tabProblems() {
  const wrap = h("div", {}, h("h2", {}, "Problems"), h("p", { class: "lead" }, "What the same validator the game's tools use finds in this pack. Click one to open it. Fix them all before pulling the pack into the game."));
  if (!S.problems.length) { wrap.append(h("p", { class: "chip ok" }, "✓ no problems found")); return wrap; }
  const open = (file, item) => {
    if (FILE_TAB[file]) { S.tab = FILE_TAB[file]; if (item !== null && item !== undefined && ITEM_NAV[file]) ITEM_NAV[file].pick(item); }
    else { S.tab = "content"; S.sel.file = file; S.sel.item = null; }
    renderNav(); renderMain();
  };
  const byFile = {};
  for (const p of S.problems) (byFile[p.split(".json")[0]] = byFile[p.split(".json")[0]] || []).push(p);
  const nFiles = Object.keys(byFile).length;
  const filter = h("input", { type: "text", placeholder: "filter problems…", style: "width:260px", value: S.sel.problemFilter || "" });
  const copy = h("button", { class: "btn small", title: "Copy every problem as text (to paste somewhere)", onclick: async () => { try { await navigator.clipboard.writeText(S.problems.join("\n")); toast("Copied " + S.problems.length + " lines"); } catch (e) { toast("The browser would not copy: select the lines instead"); } } }, "Copy the list");
  const jump = h("div", { class: "ctl", style: "gap:5px;margin-bottom:10px" });
  const groups = [];
  for (const [file, list] of Object.entries(byFile)) {
    const items = list.map(p => ({ p, item: problemItem(file, p), text: p.split(": ").slice(1).join(": ") }));
    const ul = h("ul", { class: "problems", style: "margin-top:8px" });
    const lis = items.map(x => { const li = h("li", { title: x.item !== null ? `Open ${x.item}` : "Open the file", onclick: async () => open(file, x.item) }, x.item !== null && x.text.startsWith(x.item + ": ") ? [h("b", { style: "color:var(--text)" }, x.item + " "), x.text.slice(x.item.length + 2)] : x.text); li.dataset.t = x.p.toLowerCase(); ul.append(li); return li; });
    const card = h("details", { class: "card", open: true }, h("summary", { "data-nopolish": "" }, `${file}.json (${list.length})`), ul, h("button", { class: "btn small", onclick: () => open(file, null) }, "Open " + file + ".json"));
    groups.push({ card, lis, file });
    jump.append(h("button", { class: "btn small", "data-nopolish": "", title: "Go to this file's problems", onclick: () => { card.open = true; card.scrollIntoView({ block: "start" }); } }, `${file}.json · ${list.length}`));
  }
  const apply = () => { const q = (S.sel.problemFilter || "").trim().toLowerCase(); let shown = 0; for (const g of groups) { let n = 0; for (const li of g.lis) { const on = !q || li.dataset.t.includes(q); li.style.display = on ? "" : "none"; if (on) n++; } g.card.style.display = n ? "" : "none"; shown += n; } shownNote.textContent = q ? `${shown} of ${S.problems.length} shown` : ""; };
  const shownNote = h("span", { class: "dim" }, "");
  filter.addEventListener("input", () => { S.sel.problemFilter = filter.value; apply(); });
  wrap.append(h("div", { class: "ctl", style: "gap:12px;margin-bottom:10px" }, h("span", { class: "chip bad" }, `${S.problems.length} problem${S.problems.length === 1 ? "" : "s"} in ${nFiles} file${nFiles === 1 ? "" : "s"}`), filter, shownNote, h("span", { style: "flex:1" }), copy), jump, ...groups.map(g => g.card));
  apply();
  return wrap;
}

// ---------------------------------------------------------------- boot
async function boot() {
  $("#saveBtn").addEventListener("click", () => saveAll().catch(e => toast("Save failed: " + e.message)));
  $("#newPack").addEventListener("click", () => newPack().catch(e => toast("Could not create the pack: " + e.message)));
  $("#packSelect").addEventListener("change", async e => { if (S.dirty.size && !await sure("You have unsaved changes in this pack. Switch anyway and lose them?")) { renderPackSelect(); return; } loadPack(e.target.value); });
  $("#whoBtn").addEventListener("click", async () => { const n = await ask("Your name (shown next to your saves):", S.user); if (n !== null) { S.user = n.trim(); localStorage.setItem("studio_who", S.user); updateChrome(); } });
  $("#problemChip").addEventListener("click", () => { S.tab = "problems"; renderNav(); renderMain(); });
  window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); saveAll().catch(err => toast("Save failed: " + err.message)); } });
  window.addEventListener("beforeunload", e => { if (S.dirty.size) { e.preventDefault(); e.returnValue = ""; } });
  window.__studio = { S, IMG, validatePack, DATA, synthRender, musicRender, roundAway, playSound, playSamples };   // for the parity check and debugging
  try {
    await signIn();
    await listPacks();
    if (!S.user) { const n = await ask("Welcome! Your name (shown next to your saves):", ""); S.user = (n || "").trim(); localStorage.setItem("studio_who", S.user); }
    if (!S.packs.length) { $("#main").innerHTML = "<p class='lead'>The cloud has no packs yet. Seed one from the repo with: py tools/studio/sync_pack.py push placeholder</p>"; return; }
    const want = localStorage.getItem("studio_pack");
    await loadPack(S.packs.includes(want) ? want : S.packs[0]);
  } catch (e) {
    $("#main").innerHTML = "";
    $("#main").append(h("p", { class: "lead" }, "Could not reach the studio database: " + e.message + ". Check your connection (and that Anonymous sign-in and Firestore are enabled in the Firebase console)."));
  }
}
boot();
